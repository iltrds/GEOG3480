const NOTES = {};

NOTES.u1 = `
<h2>Geomatics and where GIS fits</h2>
<p><b>Geomatics</b> is an umbrella term for the technologies that deal with the location, identity and attributes of Earth-surface features. NRCan defines it as the discipline that integrates <i>gathering, storing, processing, modelling, analyzing and delivering</i> spatially referenced information. "Geo" = geography; "matics" = information + mathematics.</p>
<p>Sub-disciplines of geomatics:</p>
<ul>
<li><b>Cartography</b>: general-purpose maps (natural and human features, often for navigation) vs. <b>thematic maps</b> (how a phenomenon is distributed).</li>
<li><b>Surveying</b>: measuring angles and applying trigonometry (e.g., a total station).</li>
<li><b>Remote sensing</b>: aerial photography, satellite Earth observation, drones, marine sensing.</li>
<li><b>GNSS</b>: global navigation satellite systems (not just GPS).</li>
<li><b>GIS</b>: e.g., ArcGIS Pro, QGIS.</li>
</ul>

<h2>What is a GIS?</h2>
<p>A GIS:</p>
<ul>
<li>belongs to the subset of information science that deals with spatially/geographically referenced data;</li>
<li>is a <b>decision support system (DSS)</b>;</li>
<li>differs from mapping/computer cartography because of its <b>analytical capacity</b>;</li>
<li>differs from <b>CAD</b> because it performs <b>spatial operations</b>;</li>
<li>differs from a <b>DBMS</b> because it handles <b>spatially explicit data</b>.</li>
</ul>
<table class="kv">
<tr><th>Source</th><th>Definition (key words)</th></tr>
<tr><td>Aronoff (1989)</td><td>Any <i>manual or computer-based</i> set of procedures used to store and manipulate geographically referenced data.</td></tr>
<tr><td>Burrough &amp; McDonnell (1998)</td><td>A powerful set of tools for collecting, storing, retrieving at will, transforming and displaying spatial data from the real world for a particular set of purposes.</td></tr>
<tr><td>Longley et al. (2005)</td><td>A computerized tool for solving geographic problems.</td></tr>
<tr><td>Berry (1993)</td><td>An organized collection of computer hardware, software, geographic data and personnel designed to capture, store, update, manipulate, analyze and display geographically referenced information.</td></tr>
<tr><td>Cowen (1990)</td><td>A system of hardware, software and procedures to support capture, management, manipulation, analysis, modelling and display of spatially referenced data for solving complex planning and management problems.</td></tr>
</table>
<p><b>Informatics</b>: the representation, processing and communication of information in natural and engineered systems (bioinformatics, hydroinformatics, geoinformatics). <b>Systems</b>: interconnected objects that form a unified whole. <b>Synergy</b> is a key property: the whole is greater than the sum of its parts.</p>

<h2>Where GIS came from</h2>
<p>Roots: geography, cartography, computer-aided design (CAD), computer graphics, surveying and photogrammetry, remote sensing and space technology.</p>
<table class="kv">
<tr><th>Who / what</th><th>Contribution</th></tr>
<tr><td><b>Roger Tomlinson</b>, Canada Geographic Information System (CGIS), 1960s</td><td>National land-use/natural resource inventory for the Canadian government. Coined the term "geographic information system" in <b>1963</b>; known as the <b>"father of GIS."</b></td></tr>
<tr><td><b>Howard Fisher</b>, Harvard Laboratory for Computer Graphics and Spatial Analysis</td><td>Early GIS software: <b>SYMAP (1964)</b>, GRID (late 1960s), POLYVRT (early 1970s), ODYSSEY.</td></tr>
<tr><td><b>Jack &amp; Laura Dangermond</b>, Esri</td><td>Founded Environmental Systems Research Institute in <b>1969</b>, inspired by the Harvard Lab and <i>Design with Nature</i>; land-use planning with an environmental focus.</td></tr>
</table>
<p>Later drivers: declassification of military applications and data; university development (historically important for open-source GIS); today's development led by the commercial sector (Esri, PCI, Autodesk, Hexagon, MapInfo); governments and NGOs lead data standardization and sharing.</p>
<p>GIS is used well beyond geography: engineering, planning, epidemiology, business, archaeology, military, forestry, criminology, natural resources. It is a multi-billion-dollar industry (e.g., the Ushahidi crisis-mapping example).</p>

<h2>Components of a GIS</h2>
<ol>
<li><b>Hardware</b>: needed advances in cartographic output, speed, memory, storage; smaller/cheaper computers; server/cloud, desktop and mobile. <b>Cloud computing</b> = distributed, on-demand computing on remote servers (ArcGIS Online, AWS, Azure, Google), so users can work on <i>thin-client</i> hardware.</li>
<li><b>Software</b>: data management, queries, tabular analysis, spatial analysis, visualization. Commercial: ArcGIS Pro, MapInfo, GeoMedia, IDRISI, MicroStation. Open source: GRASS, SAGA, QGIS, gvSIG, Whitebox. <b>GIS ≠ ArcGIS.</b> Desktop GIS vs. <b>WebGIS</b> (GIS functions delivered through web services, wider access). <b>APIs</b> let developers build apps that talk to a larger service (e.g., Copernicus OData, Google Earth Engine).</li>
<li><b>Data</b>: land surveys/cadastral (parcel) data, GPS, geocoding, census, airborne and satellite imagery, LiDAR for DEMs. Open data (NASA/ESA policies, OpenStreetMap). Metadata matters. Ethical issues: ownership and privacy.</li>
<li><b>People</b>: specialists, developers, users, data providers. URISA hierarchy: GIO/Director → GIS Manager → Coordinator → Specialist → Programmer → Analyst → Technician → Heavy GIS user.</li>
</ol>

<h2>Key concepts</h2>
<ul>
<li>GIS integrates very large datasets from diverse sources.</li>
<li>GIS creates new information and reveals hidden trends or relationships.</li>
<li>GIS is used to solve geographic problems.</li>
<li>GIS analysis, like any method, contains error.</li>
<li>There is usually more than one way to do something in GIS.</li>
</ul>
<p><b>GI Systems vs. GI Science.</b> The <i>International Journal of Geographical Information Systems</i> was re-badged as <i>…Science</i> in <b>1997</b>. GIScience studies the fundamental issues of creating, handling, storing and using geographic information: theories of spatial data and data structures, algorithms and processes, data ownership and custody, and ethics. Science is often held in higher regard than technology, though the toolbox side has arguably improved more lives.</p>
<p>Levels of GIS education: exposure to GIS as technology and its role in society (theory-rich); GIS as an instructional tool supporting other learning (supplement); GIS as a major focus or integral part of a project (application-based).</p>

<h2>Spatial analysis</h2>
<p>In its most general sense, <b>spatial analysis</b> is the analysis of spatially referenced data: a collection of tools (algorithms, approaches, methods) for solving spatial problems. It <i>includes</i> spatial statistics but is broader. It is now mostly done in GIS, but the discipline is <b>older than GIS</b>.</p>
<div class="callout key"><b>Tobler's First Law of Geography (Waldo Tobler, 1970):</b> "Everything is related to everything else, but near things are more related than distant things."</div>
<p>Examples: geographic measurement (number, length, area, volume), queries, reclassification/aggregation, distance operations/buffering, spatial filtering, spatial interpolation, surface/field operations (watershed analysis), network/location analysis.</p>
<p><b>Models.</b> A model is a simplified representation of a real-world phenomenon. In GIS, a <b>data model</b> is the abstraction of entities as vector (point, line, polygon) or raster objects; a <b>GIS model</b> can also mean a sequence of map operations (a workflow) that answers a question.</p>
<p><b>Programming.</b> Python is the most common language (ArcPy, plus shapely, geopandas, rasterio); R for spatial statistics; JavaScript for WebGIS and Google Earth Engine.</p>
`;

NOTES.u2 = `
<h2>Geospatial data</h2>
<p>Geospatial data describe objects, events or features with a location on or near Earth's surface. They combine <b>location</b> and <b>attribute</b> information.</p>
<ul>
<li><b>Vector</b>: points, lines (arcs) and polygons.</li>
<li><b>Raster</b>: pixels/grid cells. <b>Discrete</b> rasters hold distinct categories (land cover, soil type). <b>Continuous</b> rasters hold gradually changing values (elevation, temperature, an air photo).</li>
</ul>
<p>Important aspects of geospatial data:</p>
<ul>
<li><b>Timeliness</b>: when collected, how long valid, can/should it be updated?</li>
<li><b>Scale and resolution</b>: spatial scale (e.g., 1:10,000) and attribute measurement scale: binary/dichotomous, nominal (categorical), ordinal, interval/ratio.</li>
<li><b>Generalization and completeness.</b></li>
<li><b>Spatial referencing</b>: geographic vs. rectangular (projected) coordinate systems.</li>
<li><b>Topology.</b></li>
</ul>

<h2>Metadata</h2>
<p><b>Metadata is data about data.</b> It records data quality, error, and the accuracy/precision of the instruments or methods used, plus: who collected it, when, which agency manages it, who to contact, and the coordinate reference system.</p>
<ul>
<li>Usually stored as ASCII markup (XML, JSON). Some formats have built-in metadata (GeoTIFF <i>tags</i>).</li>
<li>Problem: <b>GIS software does not enforce metadata</b>; analysis tools create new outputs without requiring it.</li>
<li>Standards: US <b>FGDC</b>; <b>ISO 19115-1:2014</b> (identification, extent, quality, spatial/temporal aspects, content, spatial reference, portrayal, distribution).</li>
</ul>

<h2>Error, accuracy and precision</h2>
<p>Error is a natural part of all data. It may limit a dataset's suitability for an application, and it <b>propagates</b> through a workflow, so output error is usually greater than input error (<i>garbage in → garbage out</i>). This matters more now that free data are shared easily and GIS users have widely varying experience.</p>
<div class="two">
<div class="callout"><b>Accuracy</b>: how closely attribute and positional data correspond to reality (how <i>true</i>).</div>
<div class="callout"><b>Precision</b>: how exact a measurement is, sometimes expressed as significant decimal places (how <i>exact</i> we are in communicating it).</div>
</div>
<p>Very precise but inaccurate measurements point to a <b>systematic error / bias</b>: tightly clustered values offset from the truth (e.g., a miscalibrated instrument, a wrong datum or projection).</p>
<p>Four types of error: <b>attribute</b>, <b>positional</b>, <b>topological</b>, <b>temporal</b>.</p>

<h2>Attribute error and accuracy assessment</h2>
<p>Attribute errors come from data-entry blunders and misclassification (wrong names, counts, land-use classes). Assess them by spot-checking a <b>representative sample</b> (random or systematic) against known values (field data, visual checks), then estimate accuracy.</p>
<p>Results go in an <b>error matrix</b> (confusion matrix): predicted (map) classes vs. observed (reference) classes. In the course examples, <b>rows = predicted</b>, <b>columns = observed</b>.</p>
<div class="matrix-wrap"><table class="matrix">
<tr><th></th><th>Obs A</th><th>Obs B</th><th>Row total</th></tr>
<tr><th>Pred A</th><td class="diag">100</td><td>75</td><td>175</td></tr>
<tr><th>Pred B</th><td>36</td><td class="diag">356</td><td>392</td></tr>
<tr><th>Col total</th><td>136</td><td>431</td><td>567</td></tr>
</table></div>
<div class="formula">
<div><b>Overall accuracy</b> = Σ diagonal ÷ N = (100 + 356) / 567 = <b>80.4%</b></div>
<div><b>Producer's accuracy</b> = correct ÷ <i>column</i> (observed) total. PA<sub>A</sub> = 100/136 = <b>73.5%</b>; PA<sub>B</sub> = 356/431 = <b>82.6%</b></div>
<div><b>User's accuracy</b> = correct ÷ <i>row</i> (predicted) total. UA<sub>A</sub> = 100/175 = <b>57.1%</b>; UA<sub>B</sub> = 356/392 = <b>90.8%</b></div>
</div>
<ul>
<li><b>Producer's accuracy</b>: probability a reference sample is correctly classified. Inversely related to <b>errors of omission</b> (a class was missed). Low PA = many real class samples were assigned to other classes.</li>
<li><b>User's accuracy</b>: probability a mapped value actually matches the reference. Inversely related to <b>errors of commission</b> (something wrongly included). Low UA = many features were labelled with the wrong class.</li>
<li><b>Kappa Index of Agreement (KIA)</b>: classification accuracy that <b>accounts for chance agreement</b>.</li>
</ul>
<div class="formula">
<div>κ = (N·Σx<sub>ii</sub> − Σ(row<sub>i</sub> × col<sub>i</sub>)) / (N² − Σ(row<sub>i</sub> × col<sub>i</sub>))</div>
<div class="small">Three-class example (Urban/Forest/Agriculture): N = 76, correct = 22+19+20 = 61, Σ(row×col) = 26·27 + 23·25 + 27·24 = 1925.<br>κ = (76·61 − 1925)/(76² − 1925) = (4636 − 1925)/(5776 − 1925) = 2711/3851 = <b>0.704</b> (OA for the same matrix = 61/76 = 80.2%).</div>
</div>
<p><b>Continuous (interval/ratio) attributes</b> can't use a confusion matrix; use <b>Root-Mean-Square Error (RMSE)</b>:</p>
<div class="formula">
<div>RMSE = √( Σ(predicted − observed)² / n )</div>
<div class="small">Example: differences 1.1, −0.3, −0.7, 0.7, 0.2 → squares sum to 2.32 → √(2.32/5) = <b>0.68</b></div>
</div>

<h2>Positional error</h2>
<p>Positional accuracy measures how close mapped coordinates are to reality, with horizontal and vertical components. It is computed by comparing mapped x,y,z to values from a <b>more accurate</b> measuring device (e.g., ground control points). It is <b>scale dependent</b>; problems arise when you combine data of different scales.</p>
<div class="formula">
<div><b>Horizontal RMSE</b> = √( Σ[(x<sub>act</sub> − x<sub>map</sub>)² + (y<sub>act</sub> − y<sub>map</sub>)²] / N )</div>
<div class="small">Steps: square Δx, square Δy, add them, sum over all points, divide by N, take the square root. Course example: sum = 1,241 for 5 points → √(1241/5) = <b>15.75 m</b>.</div>
<div><b>2D MAE</b> = (1/n) Σ √(Δx² + Δy²): the true average error; less sensitive to outliers than RMSE.</div>
<div><b>Manhattan MAE</b> = (1/n) Σ (|Δx| + |Δy|): no diagonal shortcuts, like walking city blocks.</div>
</div>
<p>Because RMSE squares errors before averaging, it <b>heavily penalizes large outliers</b>.</p>

<h2>Topology</h2>
<p><b>Topology</b> is the branch of mathematics dealing with properties of geometric objects that stay <b>invariant under transformations</b> such as bending, stretching or scaling (e.g., map projection). Storing topology (1) ensures data quality and (2) enhances analysis. Not all data store it; <b>non-topological structures are faster to display and more interoperable</b>.</p>
<p>Topological primitives:</p>
<ul>
<li><b>Node</b>: a point, isolated or bounding edges (endpoints).</li>
<li><b>Edge</b>: a directed line connecting two nodes.</li>
<li><b>Face</b>: a polygon bounded by a series of directed edges.</li>
</ul>
<p>Topological relations: <b>containment</b> (island within a lake), <b>adjacency</b> (parcel C neighbours B, not A), <b>connectivity</b> (road A connects to B, not C).</p>
<p>Topological errors often come from <b>digitizing</b>: pseudo-nodes, dangling nodes, missing nodes, overshoots, undershoots, wrong direction, slivers, overlaps.</p>
<ul>
<li><b>Pseudo-node</b>: an end node connects to exactly one other end node, with nothing else there. Often means two features could be merged (e.g., one road split into two).</li>
<li><b>Dangle (dangling node)</b>: an end node that isn't connected to another feature. Often means bad snapping, but can be valid (a cul-de-sac).</li>
</ul>
<p><b>Topology rules</b> in a geodatabase define allowed interactions within a feature class or between feature classes. Examples: <i>Point must be properly inside polygons</i>; <i>Point must be covered by line</i>; <i>Line must not self-intersect</i>; <i>Must not overlap with</i>; <i>Must not have dangles</i>; <i>Polygons must not overlap / must not have gaps</i>.</p>

<h2>Temporal accuracy</h2>
<p>How reliable and up to date time-related data are: update frequency, and how ephemeral the phenomenon is.</p>
<table class="kv">
<tr><th>Temporal event type</th><th>Example</th></tr>
<tr><td>Continuous</td><td>Temperature</td></tr>
<tr><td>Majoritive (goes on most of the time)</td><td>Land-use change</td></tr>
<tr><td>Sporadic</td><td>Storms</td></tr>
<tr><td>Unique (one-off)</td><td>Creation of a floodplain</td></tr>
</table>
<p>The <b>temporal interval of acquisition</b> matters too: a stream gauge may log hourly, a satellite may revisit every 16 days. Whether that is sufficient depends on the event.</p>

<h2>Error propagation</h2>
<p>How errors in inputs, parameters or processing move through a workflow and affect the final output. A combined result reflects the inaccuracies of the <b>lowest-quality input</b>. Sources: measurement, data processing, modelling.</p>
<ul>
<li><b>Additive propagation</b>: errors accumulate. DEM ±5 m + interpolation ±1.5 m → ±6.5 m total.</li>
<li><b>Transformational propagation</b>: errors change in magnitude or form when inputs are transformed (projection distorts geometry; resampling smooths or amplifies noise).</li>
</ul>
<p>The <b>Monte Carlo method (stochastic simulation)</b> uses pseudo-random numbers to generate many possible realizations instead of one deterministic result, to quantify uncertainty. Example: Lindsay &amp; Evans (2010) simulated DEM error to map the <i>probability</i> each pixel is in a watershed (white = likely in, black = likely out, grey = maybe).</p>

<h2>Aggregation: ecological fallacy, MAUP, gerrymandering</h2>
<p><b>Spatial aggregation</b> summarizes individual data by location (regular aggregation groups by an attribute field).</p>
<p><b>Ecological fallacy</b>: inferring something about <i>individuals</i> from aggregate data for a group. A wealthy neighbourhood doesn't mean every resident is wealthy. If low-income counties have higher crime, the valid conclusion is "lower-income counties tend to have higher crime rates," <b>not</b> "lower-income persons commit more crime." Conclusions apply only at the scale of aggregation.</p>
<p><b>Modifiable Areal Unit Problem (MAUP)</b>: artificial reporting units imposed on continuous phenomena create artificial patterns. The same analysis on the same data gives different results depending on the units. Two forms:</p>
<ul>
<li><b>Scale effect</b>: results change when the <i>size</i> of the aggregation units changes (county vs. census tract). Often a valid difference of scale.</li>
<li><b>Zone (zoning) effect</b>: scale is fixed but the <i>shape/arrangement</i> of the units changes (1-mile squares vs. 1-mile hexagons). A problem because you are partly analyzing the aggregation scheme rather than the data.</li>
</ul>
<p><b>Gerrymandering</b>: setting electoral boundaries to favour an outcome (e.g., "packing"). US 2000: Gore won the popular vote but lost; 2016: Clinton won the popular vote by ~2.87M. Canada uses <b>independent, non-partisan commissions</b> that review boundaries every 10 years under the Electoral Boundaries Readjustment Act, aiming for roughly equal population per riding.</p>

<h2>Scale</h2>
<p>Map scale = map distance : ground distance. At <b>1:20,000</b>, 1 cm = 200 m. Large scale = small area, more detail (city planning); small scale = large area, less detail (world maps).</p>
<table class="kv">
<tr><th>Purpose</th><th>Type</th><th>Meaning</th></tr>
<tr><td rowspan="2">Visualizing</td><td>Cartographic scale</td><td>Ratio of map distance to real distance (1:10,000)</td></tr>
<tr><td>Geographic (observation) scale</td><td>Spatial extent of the study area (local, regional, national, global)</td></tr>
<tr><td rowspan="3">Modelling</td><td>Operational scale</td><td>Extent over which a process operates in nature</td></tr>
<tr><td>Measurement scale</td><td>Spatial resolution / size of data units (cell size, sampling interval)</td></tr>
<tr><td>Modelling scale</td><td>Resolution of the model's inputs and outputs</td></tr>
</table>
<p><b>Scale dependency</b>: an empirical relationship applies only at the scale it was measured/analyzed. A pattern can be autocorrelated at one scale and not another. Generally, <b>an analysis is only as precise as the input with the coarsest resolution</b>.</p>
<p class="small">Imagery example: a 22-inch photo covering 1 km → 55.88 cm : 100,000 cm ≈ 1:1,790; published as 1:2,000.</p>
`;

NOTES.u3 = `
<h2>Data models</h2>
<p>A data model is an abstraction of a real-world entity. A GIS data model is a structured framework for representing geographic entities and attributes digitally, primarily as <b>vector</b> or <b>raster</b>. Rasters are discrete (soil type, land cover) or continuous (elevation, temperature). Many analyses can be done in either model, and many use both.</p>

<h2>Queries</h2>
<p><b>Attribute queries</b> use <b>SQL</b> (Structured Query Language), which can create, read, update or delete data:</p>
<pre class="code">SELECT * FROM Settlements_100K WHERE POPULATION_NUM &lt;= 10000</pre>
<p><b>Spatial queries</b> (Select by Location) ask "where?" and select features by geographic relationship. They can double as data-quality checks (any buildings in the lake?) and can be chained with attribute queries ("budget hotels with ≥20 rooms within 1 km of the seafront").</p>
<table class="kv">
<tr><th>Relationship</th><th>Selects input features that…</th></tr>
<tr><td>Intersect</td><td>intersect a selecting feature</td></tr>
<tr><td>Within a distance</td><td>are within a specified (Euclidean) distance of a selecting feature</td></tr>
<tr><td>Contains</td><td>contain a selecting feature</td></tr>
<tr><td>Within</td><td>are within a selecting feature</td></tr>
<tr><td>Share a line segment with</td><td>share a segment (inputs must be lines or polygons)</td></tr>
</table>

<h2>Buffering and distance</h2>
<p>A <b>buffer</b> is a zone of interest around a feature; it implies calculating a distance field, usually Euclidean:</p>
<div class="formula"><div>d<sub>ij</sub> = √((x<sub>i</sub> − x<sub>j</sub>)² + (y<sub>i</sub> − y<sub>j</sub>)²)</div><div class="small">(1,1) to (3,2): √(2² + 1²) = √5 ≈ 2.24</div></div>
<ul>
<li><b>Vector buffers</b>: fixed or variable distance; polygon buffers can go inside, outside, or both.</li>
<li><b>Raster buffers</b> are two steps: (1) <b>Distance Accumulation</b>, (2) <b>Reclassify</b> the distance raster.</li>
<li>In ArcGIS Pro the <i>Euclidean Distance</i> tool was replaced by <b>Distance Accumulation</b>.</li>
<li>Modern GIS estimate Euclidean distance with the efficient <b>4-pass distance transform</b> (Shih &amp; Wu, 2003).</li>
<li>The alternative, <b>spread</b>, iteratively moves distance outward through cells. Historically more efficient, and powerful for weighted distance (least-cost analysis). <b>Spread is less accurate but more powerful.</b> Raster distances: orthogonal step = 1, diagonal step = 1.414.</li>
</ul>

<h2>Vector overlay (geoprocessing)</h2>
<p>Map overlay combines layers to visualize or derive new information. It is related to spatial querying, and the output is always more complex than the inputs.</p>
<table class="kv">
<tr><th>Tool</th><th>Boolean</th><th>What it does</th></tr>
<tr><td>Clip</td><td>-</td><td>Cookie cutter: extracts input features inside the clip feature. <b>No attributes added</b>.</td></tr>
<tr><td>Dissolve</td><td>-</td><td>Aggregates features that share a specified attribute value.</td></tr>
<tr><td>Intersect</td><td>A AND B</td><td>Keeps only areas common to all inputs; <b>attributes from both</b>.</td></tr>
<tr><td>Union</td><td>A OR B</td><td>Keeps all areas of all inputs with all attributes.</td></tr>
<tr><td>Symmetrical Difference</td><td>A XOR B</td><td>Keeps areas in one input or the other <b>but not both</b>.</td></tr>
<tr><td>Erase</td><td>A NOT B</td><td>Keeps only the parts of the input outside the erase features.</td></tr>
<tr><td>Identity</td><td>-</td><td>Output has the <b>extent of the input</b>; overlapping parts get the identity layer's attributes.</td></tr>
</table>

<h2>Raster overlay and map algebra</h2>
<p>In raster overlay every layer's cell references the same location, so operations run <b>cell-by-cell</b> (local operations). Point = one cell, line = a cell-wide string, area = contiguous group. <b>Map algebra</b> ("mapematics") was developed by <b>C. Dana Tomlin (1983)</b>.</p>
<ul>
<li><b>Relational operators</b> (==, !=, &gt;, &lt;, &gt;=, &lt;=): inputs need not be Boolean, but <b>output is always Boolean</b>. &gt; and &lt; act like a simple reclassification.</li>
<li><b>Boolean operators</b>: AND, OR, XOR, NOT.</li>
<li><b>Cell Statistics</b> (MIN, MAX, Mean, Median, Majority, Minority, Range, Std Dev, Sum, Variety…) across 2+ rasters. On Boolean rasters, <b>MIN behaves like AND</b> and <b>MAX behaves like OR</b>.</li>
<li><b>Arithmetic</b>: map-with-constant (unit conversion, e.g., the 3.281 ft/m factor) or map-with-map (difference, ratio). <b>NDVI = (NIR − RED)/(NIR + RED)</b>. Topographic Wetness Index = ln(catchment area / tan(slope)). Beware of dividing by zero.</li>
</ul>
<p><b>Issues</b>: different resolutions, projections or extents won't align (resample/clip); mismatched measurement scales (Boolean, nominal, ordinal, interval, ratio); units may need reclassification; analyses usually need many steps in series.</p>

<h2>Local, focal and zonal operations</h2>
<ul>
<li><b>Local</b>: each output cell depends only on the same cell in the input(s).</li>
<li><b>Focal</b>: uses a neighbourhood around each cell (e.g., the 8 surrounding cells), such as a 3×3 mean. Useful for smoothing, patterns, transitions.</li>
<li><b>Zonal</b>: summarizes values within <b>zones</b>, groups of cells sharing a value on a separate layer (admin areas, parcels). Output as a raster or a <b>table</b> (a table gives all available statistics).</li>
</ul>

<h2>Clumping (region labelling)</h2>
<p>Every contiguous group of same-valued cells gets a unique ID. Called <b>Region Group</b> in ArcGIS, r.clump in GRASS, Group in IDRISI, Clump in Whitebox.</p>
<ul>
<li>Only for <b>Boolean or categorical, integer</b> rasters. Continuous floating-point data can't be clumped because connectivity needs exact integer matches.</li>
<li>IDs are assigned in the order encountered, scanning from the upper-left corner.</li>
<li><b>Queen's case</b> includes diagonal connectivity (8 neighbours); <b>Rook's case</b> excludes it (4 neighbours). Rook's case gives the same or <b>more</b> clumps.</li>
<li>Noise removal: compute each clump's area and remove clumps below a size threshold (e.g., keep clumps &gt; 15 cells).</li>
<li>Always display clumped output with a <b>random/qualitative palette</b>: IDs are nominal labels, so a graduated ramp falsely implies order and makes adjacent clumps look alike.</li>
</ul>

<h2>Spatial filtering</h2>
<p>The most common raster neighbourhood operation, based on <b>convolution</b>: visit each cell, examine neighbours within a <b>kernel</b> (window/filter), compute a new value. Works on Boolean, categorical and continuous images.</p>
<ul>
<li><b>Mean</b> filter smooths; <b>range</b> shows local variability.</li>
<li><b>Mode/majority</b> filters remove noise in <b>categorical</b> images and tidy boundaries.</li>
<li><b>Low-pass</b> filters average and smooth. <b>High-pass</b> filters enhance edges and boundaries.</li>
<li><b>Sobel</b> edge detection computes Gx and Gy; magnitude = √(Gx² + Gy²) and direction θ = atan(Gy/Gx). Example: Gx = Gy = −150 → 212; Gx = Gy = −50 → 71.</li>
<li>Kernel size: 3×3 is most common; use an <b>odd</b> size so there's a centre cell. Computation increases rapidly with size. Repeating a filter ≈ using a larger window.</li>
<li>Kernel shape: square, circular, or elongated. Elongated kernels (e.g., 3×17) add a directional preference: <b>anisotropy</b>. <b>Isotropy</b> = the same in all directions.</li>
</ul>

<h2>Image morphology</h2>
<p>Morphological operations depend on the <b>spatial arrangement</b> of cells, not their values, so they suit Boolean rasters.</p>
<table class="kv">
<tr><th>Operation</th><th>How</th><th>Effect</th></tr>
<tr><td>Erosion</td><td>Minimum filter on a Boolean image</td><td>Shrinks features; removes small noise; detaches connected objects</td></tr>
<tr><td>Dilation</td><td>Maximum filter on a Boolean image</td><td>Grows features; joins neighbours; fills small holes</td></tr>
<tr><td>Opening</td><td>Erosion, then dilation</td><td>Removes small objects/noise while keeping larger shapes</td></tr>
<tr><td>Closing</td><td>Dilation, then erosion</td><td>Fills small holes and gaps; smooths contours</td></tr>
</table>
`;

NOTES.u4 = `
<h2>Decision modelling in GIS</h2>
<p>Integrates spatial data with multi-criteria analysis to evaluate alternatives: prepare criteria maps, define weights, aggregate results. Applications: <b>site selection</b>, <b>risk management</b> (collisions, hazards), <b>resource management</b>.</p>

<h2>Binary models / constraint mapping</h2>
<p>Overlay of multiple constraints (allowed vs. not allowed) using Boolean logic, e.g., "near a stream AND at low elevation." Eastman's Nairobi flamingo example: within 1 km of a road, within 7.5 km of the city, slope &lt; 5%, &gt; 2.5 km from a wildlife reserve, not inside the reserve.</p>
<p><b>Problems with pure constraint mapping:</b> are all constraints equally important? Should a site meeting all but one constraint be thrown out? How do you rank the suitable sites? How do you pick thresholds for "near" or "low"?</p>

<h2>Constraints vs. factors (criteria)</h2>
<div class="two">
<div class="callout"><b>Constraints</b>: hard yes/no limits that rule alternatives in or out absolutely. Boolean: 1/0, pass/fail, suitable/unsuitable.</div>
<div class="callout"><b>Factors (criteria)</b>: assessed on a continuous scale of <i>relative</i> suitability; they enhance or detract (e.g., 0 = least, 255 = most suitable).</div>
</div>
<table class="kv">
<tr><th>Constraint mapping</th><th>MCE</th></tr>
<tr><td>Suits qualitative, discrete data</td><td>Suits quantitative, continuous data</td></tr>
<tr><td>Suitable vs. unsuitable only</td><td>Relative suitability of every cell</td></tr>
<tr><td>Can't weight criteria</td><td>Uses constraints <i>and</i> weighted factors</td></tr>
<tr><td>Criteria are multiplied</td><td>Shows the spatial distribution of high-ranking cells</td></tr>
</table>
<p>MCE can assess <b>suitability or vulnerability</b> and offers a more rational, objective framework for poorly defined decision problems.</p>

<h2>Six steps of a single-objective MCE</h2>
<ol>
<li><b>Define</b> the problem: goal and supporting criteria.</li>
<li><b>Derive</b> the constraint and factor maps.</li>
<li><b>Transform</b>: standardize factors to a common scale.</li>
<li><b>Weight</b>: establish factor weights.</li>
<li><b>Combine</b>: run the MCE model.</li>
<li><b>Locate</b>: identify the top-ranked sites.</li>
</ol>
<p>Then <b>analyze</b>: visually review inputs and output, visit proposed sites, and run a <b>sensitivity analysis</b> (tweak transformations and weights to see how results change).</p>

<h2>Transforming (re-scaling) factors</h2>
<p>Factors have different units (degrees, metres…), so they must share a scale before combining.</p>
<ul>
<li><b>Normalization</b>: re-maps values from their min/max onto a new range. Most common in MCE (0–1, 0–100, 0–255). <b>More sensitive to outliers.</b></li>
<li><b>Standardization</b>: z = (x − μ)/σ. Assumes a normal (or at least symmetric) distribution.</li>
</ul>
<div class="formula">
<div><b>Benefit factor</b> (higher is better): x′ = (x − min)/(max − min)</div>
<div><b>Cost factor</b> (lower is better): x′ = 1 − (x − min)/(max − min)</div>
<div class="small">Multiply by 100 or 255 for those scales. Example: range 200–800, x = 725 on 0–255 → 255 × (525/600) = <b>223.1</b>; x = 350 → 63.75 ≈ 64.</div>
</div>
<p><b>Sigmoidal (logistic)</b> functions are also used: x′ = 1/(1 + e<sup>−k(x−x₀)</sup>).</p>
<table class="kv">
<tr><th>Suitability Modeler preference</th><th>Functions</th><th>Example</th></tr>
<tr><td>Small values best</td><td>Linear (negative), Small, MSSmall, Logistic Decay</td><td>Close to lakes → Small</td></tr>
<tr><td>Large values best</td><td>Linear (positive), Large, MSLarge, Logistic Growth, Exponential, Logarithm, Power</td><td>Far from developed areas → Large</td></tr>
<tr><td>A specific value best</td><td>Symmetric Linear, Gaussian, Near</td><td>~45% canopy cover → Near; NE aspect 22.5–67.5° → Symmetric Linear</td></tr>
</table>

<h2>Weighting factors</h2>
<p><b>Weights must sum to 1</b> so the result keeps the same range as the standardized factor scores.</p>
<h3>Ranking methods</h3>
<p>n = number of criteria, r<sub>j</sub> = rank (1 = most important). Normalize each raw score by dividing by the column sum.</p>
<table class="kv">
<tr><th>Method</th><th>Raw score</th><th>Effect</th></tr>
<tr><td>Rank sum</td><td>n − r<sub>j</sub> + 1</td><td>Even steps</td></tr>
<tr><td>Rank reciprocal</td><td>1 / r<sub>j</sub></td><td>Emphasizes top ranks</td></tr>
<tr><td>Rank exponent</td><td>(n − r<sub>j</sub> + 1)<sup>p</sup></td><td>p = 2 or 3 emphasizes top ranks more strongly</td></tr>
</table>
<div class="matrix-wrap"><table class="matrix">
<tr><th>Criterion (landfill)</th><th>Rank</th><th>Rank sum</th><th>Reciprocal</th><th>Exponent p=2</th></tr>
<tr><th>Population</th><td>1</td><td>5/15 = 0.333</td><td>1/2.283 = 0.438</td><td>25/55 = 0.454</td></tr>
<tr><th>Soil</th><td>2</td><td>4/15 = 0.267</td><td>0.5/2.283 = 0.219</td><td>16/55 = 0.291</td></tr>
<tr><th>Water</th><td>3</td><td>3/15 = 0.200</td><td>0.333/2.283 = 0.146</td><td>9/55 = 0.164</td></tr>
<tr><th>Cost</th><td>4</td><td>2/15 = 0.133</td><td>0.25/2.283 = 0.109</td><td>4/55 = 0.073</td></tr>
<tr><th>Roads</th><td>5</td><td>1/15 = 0.067</td><td>0.2/2.283 = 0.088</td><td>1/55 = 0.018</td></tr>
</table></div>
<p>Ranking tells you the order but not <i>how much</i> more important one criterion is than the next.</p>
<h3>Pairwise comparison</h3>
<p>Compare factors two at a time on a <b>9-point scale</b> (hedonic scale): 1 = equal, 3 = moderately, 5 = strongly, 7 = very strongly, 9 = extremely more important; reciprocals (1/3, 1/5…) for less important. If A is 3× B, then B is 1/3 of A. It allows <b>irregular differences</b> between criteria.</p>
<ol>
<li>Fill the square comparison matrix (diagonal = 1).</li>
<li>Sum each <b>column</b>.</li>
<li>Divide each cell by its column sum (each column now sums to 1).</li>
<li>Average across each <b>row</b> → that criterion's weight.</li>
</ol>
<div class="small">Esri example (Water, Road, Slope): column sums 2.33, 2.20, 9 → weights Water 0.4055, Road 0.4796, Slope 0.1150.</div>

<h2>Combining: the MCE model</h2>
<div class="formula">
<div>Constraints = c₁ × c₂ × … × c<sub>m</sub> = Π c<sub>i</sub></div>
<div>Weighted criteria = w₁Cr₁ + w₂Cr₂ + … + w<sub>n</sub>Cr<sub>n</sub> = Σ w<sub>j</sub>Cr<sub>j</sub> (weights sum to 1)</div>
<div><b>Suitability S = Π c<sub>i</sub> × Σ w<sub>j</sub>Cr<sub>j</sub></b></div>
</div>
<p>If <b>any constraint = 0</b> (or NoData), the cell's suitability is 0/NoData no matter how good the factors are. A <b>factor of 0 does not</b> eliminate a cell; it only lowers the weighted score, which other factors can compensate for (a trade-off).</p>
<p class="small">Course example (waste facility): &gt; 500 m from residential, &gt; 200 m from rivers, &gt; 200 m from schools, slope &lt; 5%, three candidate sites of 200 acres.</p>

<h2>Issues with MCE</h2>
<ul>
<li><b>Choice of algorithm</b>: many exist, hard to justify one, and they give different results.</li>
<li><b>Specification of weights</b> is always somewhat subjective. Outcomes can depend heavily on weights, and different interest groups may weight differently. One solution: <b>public participation GIS (PPGIS)</b>.</li>
</ul>
`;

NOTES.u5 = `
<h2>Distance metrics</h2>
<table class="kv">
<tr><th>Metric</th><th>Formula / idea</th><th>Use when</th></tr>
<tr><td>Euclidean</td><td>√((x<sub>i</sub>−x<sub>j</sub>)² + (y<sub>i</sub>−y<sub>j</sub>)²), optionally + (z<sub>i</sub>−z<sub>j</sub>)²</td><td>Projected coordinates over a relatively small area (flat plane)</td></tr>
<tr><td>Geodesic</td><td>Distance on the curved ellipsoid</td><td>Dispersed features: multiple UTM zones, large regions, global</td></tr>
<tr><td>Manhattan (taxicab/city block)</td><td>|x<sub>i</sub>−x<sub>j</sub>| + |y<sub>i</sub>−y<sub>j</sub>|</td><td>Travel on a grid</td></tr>
</table>
<p>Proximity is the inverse of distance.</p>

<h2>Distance and cost</h2>
<p><b>Cost-distance</b> is a family of metrics that calculates the least accumulated cost from each cell to (or from) the least-cost source across a cost surface. Cost can be money, time, energy, fuel, risk, resistance… Minimizing it is an <b>optimization problem</b>.</p>
<p>Euclidean distance is <b>isotropic</b>: it assumes crossing any cell costs the same. Cost distance adds <b>friction</b> proportional to perceived cost. LCA is not just shortest Euclidean distance; it minimizes a cumulative, spatially varying cost.</p>
<p>Friction examples: hiking (slope, forest density, water barriers), transportation (speed limits, congestion, road type), wildlife (habitat suitability, roads, fencing, disturbance), infrastructure (land value, soil stability, restricted areas). Real-world case: Ontario's Highway 413.</p>

<h2>The cost (friction) surface</h2>
<p>Each cell holds the <b>cost of moving one unit of distance through that cell</b>. If forest is 3× harder than pasture, pasture = 1 and forest = 3 (or use real $ values). A DEM can add upslope friction.</p>
<ol>
<li><b>Identify</b> factors that impede movement (slope, land cover, soils, protected areas…).</li>
<li><b>Transform</b> each to a common scale (1–10, 1–100) where larger = worse. If the surface is in $, all inputs must be in $.</li>
<li><b>Weight</b> factors, unless a common objective unit (like $) already accounts for importance.</li>
<li>Handle <b>barriers</b>: absolute barriers (large water bodies), soft constraints (wetlands), legal/policy masks. Use masks for prohibited areas, or very high costs for avoid-if-possible areas.</li>
</ol>
<div class="callout warn"><b>Diagonal leakage.</b> Thin linear barriers (single-cell-wide streams or roads) can be "jumped" because diagonal connectivity lets the path squeeze between two diagonally adjacent barrier cells. Fix: make them "fat," e.g., with a <b>3×3 maximum filter</b> (dilation).</div>

<h2>Least-cost path analysis (LCPA)</h2>
<p>Finds the optimum (least-resistance) path(s) across a landscape with non-uniform resistance. It measures <b>effective distance</b> rather than Euclidean distance and is <b>raster-based</b>.</p>
<p>Key concepts: <b>costs</b> (per-cell impedance), <b>sources</b> (at least a start and a destination), <b>accumulated cost</b> (minimum total cost from the source to each cell), <b>back-link/direction raster</b> (encodes the cheapest next step).</p>
<p>Applications: roads, power lines, pipelines, recreational trails, wildlife corridor connectivity, archaeology (interaction between historical settlements).</p>
<h3>Four steps</h3>
<ol>
<li>Calculate the <b>cost surface</b>.</li>
<li>Specify <b>source</b> and/or <b>target</b> cell(s).</li>
<li>Run <b>cost accumulation</b> (and create the <b>back-link</b> raster).</li>
<li>Identify the optimum <b>least-cost path(s)</b>.</li>
</ol>

<h2>Cost accumulation</h2>
<p>Accumulated cost combines (1) the distance across each cell and (2) each cell's cost per unit distance. Routing goes from cell centre to cell centre.</p>
<div class="formula">
<div><b>Orthogonal move</b> i → j: a<sub>j</sub> = a<sub>i</sub> + (cost<sub>i</sub> + cost<sub>j</sub>)/2</div>
<div><b>Diagonal move</b>: a<sub>j</sub> = a<sub>i</sub> + 1.414 × (cost<sub>i</sub> + cost<sub>j</sub>)/2 (diagonal cells are √2 apart)</div>
<div class="small">Course example (source cell cost 45 = 0.0): right neighbour 44 → (45+44)/2 = 44.5; diagonal neighbour 42 → 1.414 × (45+42)/2 = 61.5; two cells down via a cell of 43 then 38 → 44.0 + (43+38)/2 = 84.5.</div>
</div>
<p>The <b>spread</b> procedure works outward from the source: give the source 0; calculate the cost to each neighbour; visit the next-lowest cell and calculate its undiscovered neighbours; repeat. Each cell ends up with the minimum cost-distance to its "nearest" source (there can be multiple sources). During accumulation, each cell's discovering neighbour is recorded as the <b>back-link</b>. The back direction raster stores directions in degrees to the next cell along the optimal path back to the source, avoiding barriers.</p>

<h2>The least-cost path</h2>
<p>Trace the path of <b>steepest descent</b> on the cost-accumulation surface from the target back to the source. Sources are the lowest points (0) on that surface. The back-link raster gives the direction at each step.</p>

<h2>Cost allocation</h2>
<p>Identifies, for each cell, which <b>source</b> it connects to by its least-cost path, the "area of capture" of each source. It only makes sense with <b>more than one source</b>.</p>

<h2>Worked example: connecting two highways</h2>
<table class="kv">
<tr><th>Factor</th><th>Cost</th></tr>
<tr><td>Private land</td><td>$100,000/m (effective barrier)</td></tr>
<tr><td>Bridges over lakes</td><td>Not feasible</td></tr>
<tr><td>Small streams (culvert)</td><td>$500/m</td></tr>
<tr><td>Medium streams (small bridge)</td><td>$5,000–$10,000/m</td></tr>
<tr><td>Large rivers</td><td>$1,000,000/m (prohibitive)</td></tr>
<tr><td>Wetlands</td><td>$1,000,000/m (environmental)</td></tr>
<tr><td>Slope 0–5° / 5–10° / 10–15° / &gt;15°</td><td>$1,000 / $2,000 / $3,000 / $100,000 per m</td></tr>
</table>
<p>The <b>Stream Order</b> tool separates small, medium and large streams; a <b>3×3 maximum filter</b> makes streams "fat"; slope comes from the DEM. Because <b>every factor is already in $</b>, no normalization was needed.</p>
`;

NOTES.u6 = `
<h2>What is a model?</h2>
<p>A <b>model</b> is a simplified representation of a system, concept or phenomenon that helps us understand, predict or analyze how something works; a simulation of a real-world process that creates or changes a spatial entity. <b>Modelling</b> predicts the state of a phenomenon over space, time or both. A <b>simulation</b> is the running of a model over time. Models are always simplifications.</p>
<p>Motivations: solve spatial "where" problems; enhance decision-making (visualize, test "what-if" scenarios); environmental management. Also: <b>forecast</b> conditions (where/when will floods occur?), <b>examine altered conditions</b> (effect of a new Walmart on downtown retail), <b>understand processes</b> (formalize a hypothesis).</p>

<h2>Chang's (2016) four model types</h2>
<table class="kv">
<tr><th>Type</th><th>How it works</th><th>Examples</th></tr>
<tr><td><b>Binary</b></td><td>Logical (Boolean) expressions select target areas from input layers: overlay with AND/OR/NOT</td><td>Parcels within 500 m of a road AND outside the floodplain; presence/absence habitat</td></tr>
<tr><td><b>Index</b></td><td>Weights and ratings per layer combined into a suitability index (MCE)</td><td>Land suitability; vulnerability; wildfire/landslide risk</td></tr>
<tr><td><b>Regression</b></td><td>Statistical relationship between dependent and independent variables. MLR (continuous outcome), logistic (binary outcome), spatial regression (autocorrelation), <b>GWR</b> (relationships vary across space)</td><td>Crime from socio-demographics; land prices; species presence</td></tr>
<tr><td><b>Process</b></td><td>Mathematical equations of environmental processes; often dynamic and data-hungry</td><td>RUSLE (soil erosion), SWAT (hydrology), MODFLOW (groundwater), climate models</td></tr>
</table>

<h2>Other ways to classify models</h2>
<table class="kv">
<tr><th>Pair</th><th>Distinction</th></tr>
<tr><td>Descriptive vs. prescriptive (predictive)</td><td>Represent/understand existing conditions vs. find the best/optimal course of action for a future state</td></tr>
<tr><td>Deterministic vs. stochastic</td><td>One exact result from fixed inputs (no randomness) vs. randomness/probability giving a range of outcomes</td></tr>
<tr><td>Static vs. dynamic</td><td>A snapshot at one time vs. simulating change over time</td></tr>
<tr><td>Inductive vs. deductive</td><td>Bottom-up, <b>data-driven</b> (empirical): patterns → general rules vs. top-down, <b>theory-driven</b>: principles → specific predictions</td></tr>
</table>

<h2>The modelling process</h2>
<ol>
<li><b>Define the goals</b> (the research problem).</li>
<li><b>Define the system</b>: components, interactions, inputs/outputs; choose tools (map algebra, overlay).</li>
<li><b>Implement</b>, including <b>calibration</b> (parameterization) and <b>sensitivity analysis</b>.</li>
<li><b>Validate</b> (corroborate) the model.</li>
</ol>

<h2>Process models and GIS</h2>
<p>Most commercial GIS lack built-in advanced process modelling (exception: <b>ILWIS</b>), because process models are tailored to specific applications. Historically GIS has been used to <b>create model inputs</b> (slope, curvature) and <b>display outputs</b>.</p>
<div class="two">
<div class="callout"><b>Loosely coupled</b>: GIS and model are separate packages; data are exported/imported (often manually reformatted). Examples: GIS → HEC-HMS/HEC-RAS; GIS rasters → ASCII grids for MODFLOW; SWAT; RUSLE2.</div>
<div class="callout"><b>Tightly coupled</b>: model and GIS share one environment and interface; seamless, automated, can view intermediate results. Examples: Spatial Analyst (flow direction/accumulation, watersheds, cost distance, interpolation, slope/aspect), ModelBuilder (Suitability Modeler, LCP), QGIS/Whitebox/GRASS.</div>
</div>

<h2>Dynamic models</h2>
<p>GIS suits spatially variable processes, and many processes also change through time at different rates: topography (very slow), land cover (years), soil moisture (weeks), temperature (hours). GIS databases are snapshots, so ask: when was it entered, how long is it valid, when will it be updated, how much effort? (This is why metadata matters.) Snapshot modelling of continuous dynamic systems needs very fine temporal resolution. A <b>temporally indexed</b> database is an alternative, but only works for discrete entities, not continuous phenomena.</p>
<h3>Integrating GIS with spatial dynamic models</h3>
<table class="kv">
<tr><th>Approach</th><th>How</th><th>Pro</th><th>Con</th></tr>
<tr><td>Loose integration</td><td>GIS preprocesses/queries; data exported to model; results brought back</td><td>No need to modify model code</td><td>High data conversion and management effort</td></tr>
<tr><td>Interactive interface</td><td>GIS database designed for the model; custom interface for inputs, processing, visualization, automatic conversion</td><td>Reduces manual I/O</td><td>Lots of programming; model hard to modify</td></tr>
<tr><td>Mosaic integration</td><td>One system, common database: embed GIS functions in the model, or rewrite the model with GIS commands</td><td>No data exchange issues; user-defined models</td><td>GIS functions may be insufficient for complex models</td></tr>
</table>

<h2>Cellular automata (CA)</h2>
<p>A <b>discrete dynamic system</b>: space, time and states are all discrete. A regular grid of cells; each cell has one of a finite number of states; each cell looks at its neighbours (4 or 8) and applies simple <b>transition rules</b> to set its next state.</p>
<p>Conway's <b>Game of Life</b>: states alive (1) / dead (0). Survival with 2 or 3 live neighbours; reproduction of a dead cell surrounded by live neighbours; death from loneliness or overcrowding.</p>
<p>GIS applications: <b>urban growth</b> and land-use change (development more likely near roads and built-up areas), <b>forest fire spread</b> (toward dry fuel, uphill), habitat fragmentation, deforestation/desertification.</p>

<h2>Modelling human behaviour and spatial interaction</h2>
<p>Represents how people move, decide and interact: retail, public health, crime, transportation, demography, waste management. Often statistical and <b>loosely coupled</b> with GIS. Retail uses: store catchment areas, sales potential, impact of a new location. <b>Spatial interaction models (SIMs)</b> predict movement of materials, information and people.</p>
<div class="formula">
<div><b>Linear decay</b>: w = a − b·d. Example: a = 100, b = 2, d = 10 → w = 80</div>
<div><b>Power decay</b>: w = d<sup>−b</sup>. Example: b = 1.5, d = 10 → 10<sup>−1.5</sup> ≈ 0.032 (e.g., population density away from the CBD)</div>
<div><b>Exponential decay</b>: w = e<sup>−b·d</sup>. Example: b = 0.2, d = 10 → e<sup>−2</sup> ≈ 0.135 (e.g., store patronage vs. distance). Fast initial decay, smooth long tail; the most widely used in SIMs.</div>
<div class="small">w = weight/attractiveness, a = maximum at d = 0, b = decay rate, d = distance or travel cost, e ≈ 2.718.</div>
</div>
<div class="callout warn">Heads-up: the power-model slide writes "10<sup>−1.5</sup> = 1/5<sup>1.5</sup> = 0.089." The 0.089 is the value for d = 5. For d = 10, 10<sup>−1.5</sup> = 1/31.6 ≈ 0.032. If this appears on the exam, show your working.</div>
<p>Interaction depends on more than distance: physical barriers (rivers, relief), infrastructure and congestion, socio-economic preferences, and overlapping trade areas of competitors. Trip purpose matters too (grocery store vs. car dealership), as does travel mode.</p>
<p><b>Other modelling issues</b>: how well do we understand the system? Can we measure all relevant variables? Input data quality? Forecasts get less accurate further into the future and with sparser data. How to choose among competing models?</p>
<p class="small">Note: the GIS Programming half of Unit 6 (Python, OOP, arcpy) is final-exam material, not midterm.</p>
`;

NOTES.lab1 = `
<h2>Shapefiles vs. geodatabases</h2>
<p>The <b>shapefile</b> is a de facto vector format compatible with almost all GIS: geometry in <b>.shp</b>, attributes in <b>.dbf</b>, projection in <b>.prj</b>, plus index/sidecar files. Its limitations:</p>
<ul>
<li>Multi-file: 3–8 sidecar files per layer; lose one and the layer may corrupt.</li>
<li><b>2 GB</b> limit per layer.</li>
<li>Field names ≤ <b>10 characters</b>; text fields ≤ 255 characters.</li>
<li>Poor date/time handling.</li>
<li>No domains or subtypes.</li>
<li><b>Non-topological.</b></li>
</ul>
<p>A <b>geodatabase</b> stores multiple layers (vector, raster, standalone tables), has no practical size limit (depends on type), rich data types and "smart" features, metadata on coordinate systems, and <b>explicit topology rules</b>.</p>
<table class="kv">
<tr><th>Geodatabase type</th><th>Key facts</th></tr>
<tr><td>Enterprise</td><td>Multi-user, unlimited size/users, stored in an RDBMS (Oracle, SQL Server, DB2, PostgreSQL, SAP HANA); large organizations</td></tr>
<tr><td>Mobile</td><td>A single <b>SQLite</b> file, max <b>2 TB</b>; easy to share, but not all file-gdb functionality</td></tr>
<tr><td>File</td><td>Internal files in a <b>.gdb folder</b>; each dataset up to <b>1 TB</b> by default (raisable to 4 or 256 TB); the course's format. Don't touch the internal files; share by zipping the whole .gdb or exporting</td></tr>
</table>
<p>Geodatabase contents: feature classes (point, line, polygon), annotation, dimensions, raster and mosaic datasets, standalone tables.</p>

<h2>Feature datasets</h2>
<p>A <b>feature dataset</b> is a collection of vector feature classes that <b>share a common coordinate system</b>. You need one to build a <b>topology</b>, network dataset, terrain, geometric network or parcel fabric. Rasters and standalone tables <b>cannot</b> go in a feature dataset.</p>

<h2>XY resolution and XY tolerance</h2>
<ul>
<li><b>XY resolution</b>: the precision at which coordinates are stored (the fine grid coordinates snap to). Lab setting: 0.001 m.</li>
<li><b>XY tolerance (cluster tolerance)</b>: the minimum distance between coordinates before they are considered <b>coincident</b> and snapped together.</li>
<li>Z resolution and Z tolerance are the equivalent settings for 3D (elevation) values.</li>
</ul>
<div class="callout key"><b>Lab Q2.c logic.</b> Points A (562426.840383 E, 4819988.013937 N) and B (562425.032849 E, 4819988.014234 N) are about <b>1.81 m apart</b> (Δx ≈ 1.808, Δy ≈ 0.0003). With XY tolerance 1.5 m they are farther apart than the tolerance, so they <b>stay separate</b>. Their coordinates are still rounded to the 0.01 m resolution. If the tolerance were ≥ 1.81 m, they would cluster to one location.</div>

<h2>Environment settings</h2>
<p>Environment settings are parameters that control how all geoprocessing tools run: <b>current and scratch workspaces</b>, <b>output coordinate system</b>, <b>processing extent</b>, <b>cell size</b>, <b>mask</b>, <b>snap raster</b>, <b>XY resolution/tolerance</b>. Set them before any analysis so outputs land where expected and share the same projection, extent and alignment.</p>

<h2>The fire/flood analysis</h2>
<ol>
<li><b>Spatial join</b> Zoning → Addresses so each address point gets the attributes of the zone polygon it falls in.</li>
<li><b>Select by Attributes</b>: residential zones, <code>ZONEMAP LIKE 'R%'</code> (<code>%</code> is the SQL wildcard: any characters after R).</li>
<li><b>Select by Location</b> with selection type <b>"Select subset from the current selection"</b> so only the residential addresses are searched:
<ul><li><b>Fire</b>: <i>Within a distance</i> 2 km of fire stations with <b>Invert spatial relationship</b> on → addresses <i>farther</i> than 2 km.</li>
<li><b>Flood</b>: <i>Within a distance</i> 250 m of Floodway polygons, not inverted.</li></ul></li>
</ol>
<pre class="code">arcpy.management.SelectLayerByLocation("Addresses", "WITHIN_A_DISTANCE",
    "Zoning", "250 Meters", "SUBSET_SELECTION", "NOT_INVERT")</pre>
<p>Every geoprocessing tool can be run from Python; each tool's help page shows the syntax.</p>

<h2>Topology for the bike network</h2>
<ul>
<li>Built inside a new feature dataset with an <b>XY (cluster) tolerance of 10 m</b>, so vertices within 10 m are treated as coincident (NAD 1983 UTM Zone 17N).</li>
<li>Errors to catch: small gaps at intersections, small overshoots, lanes that stop short of an intersection and restart, and legitimate open branch ends at the network's edge.</li>
<li>One rule finds all of these: <b>Must Not Have Dangles</b> (line endpoints must touch another line). Gaps, overshoots and undershoots all create dangles.</li>
<li>Use the <b>Error Inspector</b> to count and step through errors, then <b>fix</b> each with editing tools or mark it as an <b>Exception</b> (e.g., a true end branch at the periphery).</li>
<li>"Must be larger than cluster tolerance" flags features collapsed by snapping. Likely causes: the <b>accordion effect</b> (both ends snap inward) and <b>self-snapping</b> of short, tightly curved features. Shapefiles store curves as densified vertices, while geodatabases can store true curves.</li>
<li>Saving edits ≠ saving the project.</li>
</ul>
`;

NOTES.lab2 = `
<h2>The problem</h2>
<p>Site a new backcountry campsite on the South La Cloche ridge in Killarney Provincial Park (MCE with the Suitability Modeler), then route a trail from it to two trailheads (least-cost path).</p>

<h2>Constraints and criteria</h2>
<div class="two">
<div class="callout"><b>Constraints (1 / NoData masks)</b>
<ul><li>Elevation ≤ 475 m (ecological concerns)</li>
<li>Not within 200 m of a <b>canoe</b> waterbody (any waterbody within 50 m of a portage trail)</li>
<li>Within 200 m of a <b>non-canoe</b> waterbody (drinking/cooking water) but not in it</li></ul></div>
<div class="callout"><b>Criteria (factors)</b>
<ul><li>Slope &lt; 5%, ideal 2.5% → <b>Symmetric Linear</b> (0–5)</li>
<li>Elevation: higher is better (views) → <b>Large</b>, upper threshold 475</li>
<li>Distance from existing campsites: farther is better (solitude, lower impact) → <b>Large</b></li></ul></div>
</div>

<h2>Environment settings used</h2>
<table class="kv">
<tr><th>Setting</th><th>Value</th><th>Purpose</th></tr>
<tr><td>Current &amp; scratch workspace</td><td>Project gdb</td><td>Where outputs and intermediate files are written</td></tr>
<tr><td>Output coordinate system</td><td>NAD83 UTM 17N (DEM)</td><td>All outputs share one projection</td></tr>
<tr><td>Processing extent</td><td>StudyArea</td><td>Limits the area processed</td></tr>
<tr><td>Cell size</td><td>Same as DEM (30 m)</td><td>Output raster resolution</td></tr>
<tr><td>Mask</td><td>StudyArea</td><td>Cells outside become NoData</td></tr>
<tr><td>Snap raster</td><td>DEM</td><td>Aligns output cells to the DEM grid</td></tr>
</table>

<h2>Building the constraint mask</h2>
<ol>
<li><b>Reclassify</b> DEM: 0–475 → 1, everything else NoData.</li>
<li>Select portage trails (Portage = 1) → select waterbodies within 50 m → export canoe waterbodies; <b>switch selection</b> → non-canoe waterbodies.</li>
<li><b>Distance Accumulation</b> (planar) from each set; <b>Reclassify</b> (canoe: ≥200 m → 1; non-canoe: 1–200 m → 1; all else NoData).</li>
<li><b>Raster Calculator</b>: multiply the three masks. 1 × 1 = 1, but <b>1 × NoData = NoData</b>, so only cells passing all constraints survive.</li>
</ol>

<h2>Suitability model</h2>
<ul>
<li>Slope via <b>Surface Parameters</b> (percent rise); distance to campsites via Distance Accumulation.</li>
<li>Suitability scale 1–10, <b>weight by percent</b>. The <b>multiplier</b> option exaggerates contrast among top-ranked areas, adding artificial emphasis to inherently imprecise data. Suitability models are a <b>first-pass</b> tool to narrow choices.</li>
<li>Apply the final constraint mask in the model.</li>
<li><b>Locate</b> the single best 900 m² area (one 30 m × 30 m cell); <b>Raster to Point</b> to see it.</li>
</ul>
<h3>Pairwise weights for the lab (Q2.4)</h3>
<div class="matrix-wrap"><table class="matrix">
<tr><th></th><th>Slope</th><th>Elevation</th><th>Proximity</th></tr>
<tr><th>Slope</th><td>1</td><td>1/2</td><td>3</td></tr>
<tr><th>Elevation</th><td>2</td><td>1</td><td>4</td></tr>
<tr><th>Proximity</th><td>1/3</td><td>1/4</td><td>1</td></tr>
<tr><th>Column sum</th><td>3.333</td><td>1.75</td><td>8</td></tr>
</table></div>
<p>Normalize columns and average rows: Slope (0.300 + 0.286 + 0.375)/3 = <b>0.320</b>; Elevation (0.600 + 0.571 + 0.500)/3 = <b>0.557</b>; Proximity (0.100 + 0.143 + 0.125)/3 = <b>0.123</b>. Sum = 1. Entered as ≈ 32% / 56% / 12%.</p>

<h2>Least-cost trail</h2>
<ol>
<li><b>Cost_Slope</b>: reclassify percent slope 0–3 → 1, &gt;3–10 → 2, &gt;10–20 → 3, &gt;20–30 → 4, &gt;30–40 → 5, &gt;40–50 → 6, &gt;50–60 → 7, &gt;60 → 8.</li>
<li><b>Cost_Waterbodies</b>: give water a cost <b>greater than the number of cells on the raster's diagonal</b>, √(columns² + rows²). Crossing one water cell then costs more than any all-land route across the raster, so the path avoids water unless there's no alternative. <b>Feature to Raster</b>, then <b>Reclassify</b> NoData (land) → 1.</li>
<li><b>Cost_Surface</b> = Cost_Slope + Cost_Waterbodies (Raster Calculator).</li>
<li><b>Distance Accumulation</b> from the campsite with the cost raster → accumulation raster (0 at campsite) + <b>back direction raster</b>.</li>
<li><b>Optimal Path As Line</b> from the trailheads using both rasters, path type <b>Each zone</b> (one path per trailhead).</li>
</ol>
<p><b>Dilating water (P3.1)</b>: a reason to dilate is to stop diagonal leakage through narrow water and keep the trail back from shorelines. A reason not to is that it can close narrow land bridges between lakes and overstate water, removing valid routes.</p>
<p><b>Making the trail more direct along the ridge (P3.3)</b>: e.g., soften the slope cost classes so moderate slopes are penalized less (steep slopes still cost most), or add an elevation/ridge factor that lowers cost at higher elevations, weighted into the cost surface.</p>
`;

NOTES.formulas = `
<h2>Formula sheet</h2>
<p>Calculators are allowed and the math is "basic arithmetic, powers." Practise each of these until you can do it without looking.</p>
<div class="fgrid">
<div class="fcard"><h4>Euclidean distance</h4><div class="formula"><div>√((x₁−x₂)² + (y₁−y₂)²)</div></div><p class="small">(2,3)→(5,7): √(9+16) = 5</p></div>
<div class="fcard"><h4>Manhattan distance</h4><div class="formula"><div>|x₁−x₂| + |y₁−y₂|</div></div><p class="small">(2,3)→(5,7): 3 + 4 = 7</p></div>
<div class="fcard"><h4>Overall accuracy</h4><div class="formula"><div>Σ diagonal / N</div></div></div>
<div class="fcard"><h4>Producer's accuracy (omission)</h4><div class="formula"><div>correct<sub>k</sub> / column (observed) total<sub>k</sub></div></div></div>
<div class="fcard"><h4>User's accuracy (commission)</h4><div class="formula"><div>correct<sub>k</sub> / row (predicted) total<sub>k</sub></div></div></div>
<div class="fcard"><h4>Kappa</h4><div class="formula"><div>(N·Σx<sub>ii</sub> − Σ row·col) / (N² − Σ row·col)</div></div></div>
<div class="fcard"><h4>RMSE (attribute)</h4><div class="formula"><div>√(Σ(P − O)² / n)</div></div></div>
<div class="fcard"><h4>RMSE (horizontal position)</h4><div class="formula"><div>√(Σ(Δx² + Δy²) / n)</div></div></div>
<div class="fcard"><h4>2D MAE / Manhattan MAE</h4><div class="formula"><div>(1/n)Σ√(Δx²+Δy²) · (1/n)Σ(|Δx|+|Δy|)</div></div></div>
<div class="fcard"><h4>Additive error</h4><div class="formula"><div>±e₁ + ±e₂ → ±(e₁+e₂)</div></div><p class="small">±5 m + ±1.5 m = ±6.5 m</p></div>
<div class="fcard"><h4>Map scale</h4><div class="formula"><div>1:S → 1 cm = S cm = S/100 m</div></div><p class="small">1:20,000 → 1 cm = 200 m</p></div>
<div class="fcard"><h4>NDVI</h4><div class="formula"><div>(NIR − RED)/(NIR + RED)</div></div></div>
<div class="fcard"><h4>Linear normalization</h4><div class="formula"><div>benefit: (x−min)/(max−min)<br>cost: 1 − (x−min)/(max−min)</div></div><p class="small">× 100 or × 255 for those scales</p></div>
<div class="fcard"><h4>Standardization (z-score)</h4><div class="formula"><div>z = (x − μ)/σ</div></div></div>
<div class="fcard"><h4>Rank weights</h4><div class="formula"><div>sum: n−r+1 · recip: 1/r · exp: (n−r+1)<sup>p</sup><br>then ÷ column total</div></div></div>
<div class="fcard"><h4>Pairwise weights</h4><div class="formula"><div>cell ÷ column sum, then average each row</div></div></div>
<div class="fcard"><h4>MCE suitability</h4><div class="formula"><div>S = Π c<sub>i</sub> × Σ w<sub>j</sub>Cr<sub>j</sub>, Σw = 1</div></div></div>
<div class="fcard"><h4>Cost accumulation</h4><div class="formula"><div>orthogonal: a + (c<sub>i</sub>+c<sub>j</sub>)/2<br>diagonal: a + 1.414(c<sub>i</sub>+c<sub>j</sub>)/2</div></div></div>
<div class="fcard"><h4>Cells on raster diagonal</h4><div class="formula"><div>√(cols² + rows²)</div></div><p class="small">Lab 2 water cost must exceed this</p></div>
<div class="fcard"><h4>Sobel magnitude / direction</h4><div class="formula"><div>√(Gx² + Gy²) · θ = atan(Gy/Gx)</div></div></div>
<div class="fcard"><h4>Distance decay</h4><div class="formula"><div>linear w = a − bd<br>power w = d<sup>−b</sup><br>exponential w = e<sup>−bd</sup></div></div></div>
</div>
`;

 ["Absolute barrier vs. soft constraint", "Absolute: impassable (large lakes); very high cost or mask. Soft: avoid if possible (wetlands); high cost."],
 ["Diagonal leakage", "A path can slip between diagonally adjacent cells of a one-cell-wide barrier. Fix by thickening it (3×3 maximum filter)."],
