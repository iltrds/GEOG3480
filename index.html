<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="GEOG*3480 midterm study site: unit notes, formula sheet, flashcards, per-unit quizzes and a timed 60-minute practice exam.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GEOG*3480 Midterm Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky map-sheet header with tabs; each view is a sheet. Category colours act as a land-cover legend; progress bars are drawn as scale bars. */
:root{
  --paper:#EEF2EF; --sheet:#FBFCFA; --ink:#17252B; --muted:#56676C; --line:#CDD7D2; --line-strong:#9FB0AA;
  --accent:#1D5B8E; --accent-ink:#FFFFFF; --accent-soft:#DCE8F2; --contour:#9A6B3F;
  --ok:#24734A; --ok-soft:#DDEFE4; --bad:#AE3427; --bad-soft:#F6E0DC; --flag:#A87508; --flag-soft:#F5EACB;
  --shadow:0 1px 0 rgba(23,37,43,.04), 0 8px 24px -12px rgba(23,37,43,.18);
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --bar-bg:#17252B; --bar-fg:#EEF2EF; --bar-warn:#F2C14E; --bar-crit:#FF8A75;
  --c-u1:#3F78B5; --c-u2:#5E9446; --c-u3:#C29B1E; --c-u4:#B65C40; --c-u5:#7259B0; --c-u6:#2E9693; --c-lab1:#8A7560; --c-lab2:#AD4A80;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1518; --sheet:#152024; --ink:#E3EBE8; --muted:#97A8A9; --line:#29383C; --line-strong:#4A5D61;
  --accent:#72B1E4; --accent-ink:#0B1A26; --accent-soft:#1B3245; --contour:#C59A6C;
  --ok:#5EC48C; --ok-soft:#173527; --bad:#EE7B69; --bad-soft:#3D1F1B; --flag:#E5B84A; --flag-soft:#3A2F14;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 28px -14px rgba(0,0,0,.6);
  --bar-bg:#24363C; --bar-fg:#E3EBE8; --bar-warn:#E5B84A; --bar-crit:#F08A79;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1518; --sheet:#152024; --ink:#E3EBE8; --muted:#97A8A9; --line:#29383C; --line-strong:#4A5D61;
  --accent:#72B1E4; --accent-ink:#0B1A26; --accent-soft:#1B3245; --contour:#C59A6C;
  --ok:#5EC48C; --ok-soft:#173527; --bad:#EE7B69; --bad-soft:#3D1F1B; --flag:#E5B84A; --flag-soft:#3A2F14;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 28px -14px rgba(0,0,0,.6);
  --bar-bg:#24363C; --bar-fg:#E3EBE8; --bar-warn:#E5B84A; --bar-crit:#F08A79;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--paper)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
.eyebrow{font-family:var(--f-display);font-stretch:125%;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:600;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:.88rem;color:var(--muted)}
.swatch{display:inline-block;width:.8em;height:.8em;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.15);vertical-align:-.05em}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding-inline:max(16px, env(safe-area-inset-left, 0px))}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-stretch:118%;font-weight:750;font-size:1.05rem;letter-spacing:.01em}
.brand span{font-size:.82rem;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.93rem;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--sheet)}
.tab[aria-current="page"]{color:var(--ink);background:var(--sheet);box-shadow:inset 0 -2px 0 var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:1px}

main{padding-top:28px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.view{animation:none}.flip-inner{transition:none!important}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--sheet);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.95rem;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* Sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:24px}
@media (max-width:560px){.pad{padding:18px}}

/* HOME */
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--sheet);box-shadow:var(--shadow)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;padding:34px}
@media (max-width:820px){.hero-in{grid-template-columns:minmax(0,1fr);padding:24px}}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);font-stretch:112%;font-weight:780;letter-spacing:-.01em;margin:8px 0 12px}
.hero p.lead{max-width:56ch;font-size:1.05rem;color:var(--muted);margin:0 0 20px}
.count{background:color-mix(in srgb, var(--sheet) 82%, transparent);backdrop-filter:blur(2px);border:1px solid var(--line);border-radius:12px;padding:18px 20px;align-self:start}
.count-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 12px}
.count-grid div{text-align:center}
.count-grid b{display:block;font-family:var(--f-mono);font-size:2rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.count-grid span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.9rem;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px}
@media (max-width:900px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.go{display:flex;flex-direction:column;gap:6px;padding:18px;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--sheet);border-radius:12px;box-shadow:var(--shadow)}
.go:hover{border-color:var(--accent)}
.go .h3{font-family:var(--f-display);font-size:1.08rem;font-stretch:110%;font-weight:700}
.go p{margin:0;font-size:.9rem;color:var(--muted)}
.go .stat{margin-top:auto;padding-top:8px;font-family:var(--f-mono);font-size:.85rem;color:var(--ink)}
.legend{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 28px;margin-top:14px}
@media (max-width:640px){.legend{grid-template-columns:minmax(0,1fr)}}
.legend-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.legend-row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-row .val{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.mini{grid-column:2 / 4;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:-4px}
.mini i{display:block;height:100%;background:var(--accent)}

/* Scale bar progress */
.scalebar{display:flex;height:9px;border:1.5px solid var(--ink);border-radius:1px;overflow:hidden;background:var(--sheet)}
.scalebar i{flex:1;border-right:1.5px solid var(--ink)}
.scalebar i:last-child{border-right:0}
.scalebar i.on{background:var(--ink)}
.scalebar i.on.alt{background:var(--accent)}
.scale-labels{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:3px}

/* READ */
.read{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.read{grid-template-columns:minmax(0,1fr)}}
.toc{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 76px);display:flex;flex-direction:column;gap:2px}
.toc .eyebrow{margin:10px 10px 4px}
.toc button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.92rem;color:var(--muted)}
.toc button:hover{background:var(--sheet);color:var(--ink)}
.toc button[aria-current="true"]{background:var(--sheet);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.toc .tick{margin-left:auto;font-size:.8rem;color:var(--ok)}
.toc-select{display:none}
@media (max-width:860px){.toc{display:none}.toc-select{display:block;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--sheet);color:var(--ink);font:inherit;margin-bottom:14px}}
article.notes{padding:32px 40px;min-width:0}
@media (max-width:560px){article.notes{padding:20px 18px}}
.notes-head{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}
.notes-head h1{font-size:clamp(1.6rem,3.4vw,2.2rem);font-stretch:110%;font-weight:760}
.notes h2{font-size:1.02rem;font-stretch:125%;text-transform:uppercase;letter-spacing:.07em;margin:30px 0 10px;padding-top:4px;color:var(--ink)}
.notes h2::before{content:"";display:block;width:28px;height:2px;background:var(--contour);margin-bottom:10px}
.notes h3{font-size:1.02rem;margin:20px 0 6px;font-weight:650}
.notes p,.notes li{max-width:72ch}
.notes p{margin:0 0 12px}
.notes ul,.notes ol{padding-left:1.3em;margin:0 0 14px}
.notes li{margin:3px 0}
.notes table{border-collapse:collapse;width:100%;font-size:.92rem;margin:6px 0 16px}
.notes .kv{display:block;overflow-x:auto}
.notes .kv tbody{display:table;width:100%;border-collapse:collapse}
.notes th,.notes td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.notes th{font-weight:600;background:color-mix(in srgb, var(--accent-soft) 55%, transparent);font-size:.86rem}
.matrix-wrap{overflow-x:auto;margin:6px 0 14px}
.notes table.matrix{width:auto;font-family:var(--f-mono);font-size:.86rem;font-variant-numeric:tabular-nums}
.notes table.matrix td,.notes table.matrix th{border:1px solid var(--line);text-align:center;padding:6px 12px}
.notes table.matrix td.diag{background:var(--ok-soft);font-weight:600}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 14px;margin:8px 0 14px;display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.formula .small{font-family:var(--f-body)}
.callout{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0 14px;background:var(--paper)}
.callout.key{border-color:var(--accent);background:var(--accent-soft)}
.callout.warn{border-color:var(--flag);background:var(--flag-soft)}
.callout ul{margin:6px 0 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}
.two .callout{margin:0 0 14px}
pre.code{font-family:var(--f-mono);font-size:.84rem;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;white-space:pre}
code{font-family:var(--f-mono);font-size:.88em;background:var(--paper);padding:1px 4px;border-radius:4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.fcard h4{font-size:.88rem;font-weight:650;margin-bottom:6px}
.fcard .formula{margin:0;font-size:.82rem;padding:8px 10px}
.fcard p{margin:6px 0 0}
.notes-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:28px;padding-top:16px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--ok)}

/* Deck chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--sheet);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:.86rem;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--line-strong)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.toolbar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:7px 12px;cursor:pointer;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* FLASHCARD */
.flip{perspective:1400px;max-width:760px;margin:0 auto;cursor:pointer}
.flip-inner{position:relative;min-height:320px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;display:grid}
.flip.is-flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:30px 34px;display:flex;flex-direction:column;gap:14px}
.face.back{transform:rotateY(180deg)}
.face .meta{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted)}
.face .term{margin:auto 0;font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:clamp(1.4rem,3.6vw,2.1rem);text-align:center;text-wrap:balance}
.face .def{margin:auto 0;font-size:1.12rem;line-height:1.6;text-align:center;text-wrap:pretty}
.face .hint{text-align:center;font-size:.8rem;color:var(--muted)}
.face.front{background-image:repeating-linear-gradient(0deg, transparent 0 31px, color-mix(in srgb, var(--line) 45%, transparent) 31px 32px)}
.card-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px auto 0;max-width:760px}
.card-actions .btn{min-width:160px;justify-content:center}
.btn.learn{border-color:var(--flag);color:var(--flag)}
.btn.know{border-color:var(--ok);color:var(--ok)}
.deck-progress{max-width:760px;margin:0 auto 16px}
.deck-progress .row{justify-content:space-between;font-size:.86rem;color:var(--muted);margin-bottom:6px}

/* QUIZ */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--sheet);box-shadow:var(--shadow);cursor:pointer;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .top-line{display:flex;align-items:center;gap:8px}
.tile .h3{font-family:var(--f-display);font-size:1.02rem;font-weight:650}
.tile .foot{display:flex;justify-content:space-between;margin-top:auto;padding-top:6px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tile.mixed{background:var(--accent-soft);border-color:var(--accent)}
.qcard{max-width:780px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-size:1.18rem;font-weight:500;line-height:1.5;margin:6px 0 18px;text-wrap:pretty}
.ctx{margin:-6px 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.review-item .ctx{margin:6px 0 10px}
.ctx-scroll{overflow-x:auto}
.ctx table{border-collapse:collapse;font-family:var(--f-mono);font-size:.9rem;font-variant-numeric:tabular-nums}
.ctx table.cm th,.ctx table.cm td{border:1px solid var(--line-strong);padding:7px 14px;text-align:center;white-space:nowrap}
.ctx table.cm th{font-family:var(--f-body);font-weight:600;font-size:.84rem;background:var(--sheet)}
.ctx table.cm tr:first-child th:first-child{background:transparent;border-color:transparent transparent var(--line-strong) transparent}
.ctx table.cm td{background:var(--sheet)}
.ctx table.cgrid td{border:1.5px solid var(--line-strong);width:118px;height:84px;text-align:center;vertical-align:middle;background:var(--sheet)}
.ctx table.cgrid td b{display:block;font-size:1.05rem;color:var(--accent)}
.ctx table.cgrid td span{display:block;font-size:.8rem;color:var(--muted)}
.ctx table.cgrid td .dim{font-size:1rem}
.ctx-note{font-size:.8rem;color:var(--muted);margin-top:8px}
@media (max-width:560px){.ctx{padding:10px}.ctx table{font-size:.82rem}.ctx table.cm th,.ctx table.cm td{padding:6px 6px;white-space:normal}.ctx table.cm th{font-size:.74rem;hyphens:auto}.ctx table.cgrid td{width:96px;height:76px}}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;text-align:left;border:1px solid var(--line-strong);background:var(--sheet);border-radius:10px;padding:12px 14px;cursor:pointer;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .let{font-family:var(--f-mono);font-size:.82rem;width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--muted)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.sel .let{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .let{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt[disabled]{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.explain.ok{border-color:var(--ok)}
.explain.no{border-color:var(--bad)}
.explain b.v-ok{color:var(--ok)} .explain b.v-no{color:var(--bad)}
.result-big{font-family:var(--f-display);font-stretch:112%;font-weight:780;font-size:clamp(2.6rem,7vw,4rem);line-height:1}
.review-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.review-item{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--sheet)}
