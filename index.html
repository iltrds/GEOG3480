 {"q":"A pseudo-node usually indicates that:","a":["Two features could be merged into one","A polygon boundary has a gap in it","A point lies outside its containing polygon","A line crosses over itself somewhere"],"e":"A pseudo-node is where exactly two end nodes meet with nothing else, e.g., a road split into two segments."},
 {"q":"\"Parcel C neighbours parcel B but not parcel A\" describes which topological relation?","a":["Adjacency","Containment","Connectivity","Coincidence"],"e":"Containment = island in lake; connectivity = road networks; adjacency = shared boundaries."},
 {"q":"Land-use change is an example of which type of temporal event?","a":["Majoritive","Continuous","Sporadic","Unique"],"e":"Continuous: temperature. Majoritive: land-use change. Sporadic: storms. Unique: creation of a floodplain."},
 {"q":"A DEM has vertical accuracy of ±3 m and the interpolation adds ±0.8 m. Under additive propagation the total uncertainty is:","a":["±3.8 m","±2.2 m","±3.0 m","±2.4 m"],"e":"Additive propagation sums the errors: 3 + 0.8 = ±3.8 m."},
 {"q":"Reprojecting data and distorting its geometry is an example of:","a":["Transformational propagation","Additive propagation","The modifiable areal unit problem","A topological digitizing error"],"e":"Transformational propagation: errors change form/magnitude when inputs are transformed (projection, resampling)."},
 {"q":"Monte Carlo simulation is used in GIS mainly to:","a":["Quantify uncertainty using many random realizations","Automatically find and repair topological errors","Convert vector data to raster at random resolutions","Choose the optimal factor weights for an MCE model"],"e":"Stochastic simulation produces multiple possible outcomes to estimate how error propagates."},
 {"q":"County data show lower-income counties have higher crime rates. Which conclusion avoids the ecological fallacy?","a":["Lower-income counties tend to have higher crime rates","Lower-income people are more likely to commit crime","Every resident of a low-income county is at higher risk","Wealthy individuals in those counties commit less crime"],"e":"Conclusions from aggregated data apply only at the scale of aggregation (counties), not to individuals."},
 {"q":"Results change when the same data are aggregated into 1-mile squares instead of 1-mile hexagons. This is the:","a":["Zone effect of MAUP","Scale effect of MAUP","Ecological fallacy","Additive propagation"],"e":"Same size, different shape = zone effect. Changing unit size (county vs. tract) = scale effect."},
 {"q":"Which metadata standard was cited in Unit 2?","a":["ISO 19115-1:2014","ISO 9001","GeoJSON RFC 7946","IEEE 754"],"e":"ISO 19115-1:2014 and the US FGDC standards."},
 {"q":"At a map scale of 1:20,000, 1 cm on the map represents:","a":["200 m","20 m","2 km","2,000 m"],"e":"20,000 cm = 200 m."},
 {"q":"The spatial resolution or cell size of your data is its:","a":["Measurement scale","Operational scale","Cartographic scale","Geographic scale"],"e":"Measurement scale = resolution/size of data units. Operational scale = extent a process operates over."},
 {"q":"Which is an advantage of non-topological data structures?","a":["They are faster to display and more interoperable","They prevent digitizing errors such as overshoots","They store adjacency between polygons explicitly","They require GIS software to enforce metadata"],"e":"Topology helps quality and analysis; non-topological formats are faster to draw and more interoperable."}
],
u3: [
 {"q":"Which Boolean operation does the Symmetrical Difference overlay tool perform?","a":["A XOR B","A AND B","A OR B","A NOT B"],"e":"Intersect = AND, Union = OR, Symmetrical Difference = XOR, Erase = A NOT B."},
 {"q":"Which overlay tool keeps the full extent of the input layer while adding attributes of overlapping features from a second layer?","a":["Identity","Clip","Intersect","Erase"],"e":"Identity output has the input's extent; overlapping portions get the identity features' attributes."},
 {"q":"Clip differs from Intersect in that Clip:","a":["Adds no attributes from the clip layer","Keeps all areas from both input layers","Removes the areas where layers overlap","Requires raster layers as its inputs"],"e":"Clip is a cookie cutter. Intersect writes attributes from both inputs."},
 {"q":"The Erase tool answers which question: \"Which locations have…\"","a":["Soil type A but not vegetation type B?","Soil type A or vegetation type B (or both)?","Both soil type A and vegetation type B?","Soil type A or vegetation type B, but not both?"],"e":"Erase = A NOT B. The others are Union (OR), Intersect (AND) and Symmetrical Difference (XOR)."},
 {"q":"In a raster model, creating a buffer is a two-step process of:","a":["Distance Accumulation, then Reclassify","Reclassify, then Clip to the study area","Region Group, then Zonal Statistics","Focal Statistics, then Dissolve"],"e":"Calculate distance to sources, then reclassify distances within the buffer width."},
 {"q":"Why might spread-based distance be preferred over a Euclidean distance transform?","a":["It supports weighted (cost) distance operations","It is more accurate than the distance transform","It does not require any source cells to run","It can be computed directly on vector features"],"e":"Spread is less accurate but more powerful: it enables least-cost analysis."},
 {"q":"The output of a relational operator such as Elevation > 400 is:","a":["A Boolean raster","A continuous raster","A categorical raster with many classes","A vector layer"],"e":"Relational operators always produce Boolean output."},
 {"q":"Applying Cell Statistics MAXIMUM to two Boolean rasters is equivalent to:","a":["OR","AND","XOR","NOT"],"e":"MAX = 1 if either is 1 → OR. MIN = 1 only if both are 1 → AND."},
 {"q":"NIR = 0.5, RED = 0.1. What is NDVI?","a":["0.67","0.80","0.40","1.50"],"e":"(0.5 − 0.1)/(0.5 + 0.1) = 0.4/0.6 = 0.67."},
 {"q":"Map algebra was developed by:","a":["C. Dana Tomlin","Waldo Tobler","Roger Tomlinson","Howard Fisher"],"e":"Tomlin, 1983."},
 {"q":"A focal operation differs from a local operation because it:","a":["Uses values of neighbouring cells","Uses zones from a separate raster","Works on vector rather than raster data","Uses a single input raster at a time"],"e":"Local = cell-by-cell; focal = neighbourhood; zonal = zones."},
 {"q":"Why can't clumping (Region Group) be run on a raw floating-point elevation raster?","a":["Connectivity needs exact matches of integer values","Elevation rasters contain too few unique values","Floating-point rasters do not support NoData","Clumping is designed for vector polygon data"],"e":"Clumping needs Boolean or categorical integer data."},
 {"q":"Compared with Queen's case, clumping with Rook's case connectivity produces:","a":["The same number of clumps or more","The same number of clumps or fewer","The same clumps that Queen's case gives","Clumps connected along diagonals instead"],"e":"Rook's case ignores diagonal connections, so diagonally touching groups are split."},
 {"q":"Clumped rasters should be displayed with:","a":["A random/qualitative palette","A sequential colour ramp","A diverging colour ramp","Greyscale stretched by standard deviation"],"e":"Clump IDs are nominal, so ordered ramps are misleading and make adjacent clumps look alike."},
 {"q":"Which filter is best for removing noise from a land-cover (categorical) raster?","a":["A majority (mode) filter","A mean (low-pass) filter","A high-pass edge filter","A Sobel gradient filter"],"e":"Averaging categories makes no sense; the majority filter keeps valid class values and tidies boundaries."},
 {"q":"A high-pass filter is primarily used to:","a":["Enhance edges and boundaries","Smooth the data by averaging","Fill small holes in features","Summarize values within zones"],"e":"Low-pass smooths; high-pass enhances edges."},
 {"q":"Kernel sizes for spatial filters are usually odd numbers because:","a":["There must be a centre cell","Even kernels are slower to compute","Odd kernels give isotropic results","GIS software rejects even sizes"],"e":"An odd size (3×3, 5×5) gives a centre cell."},
 {"q":"A 3 × 17 cell mean filter is an example of:","a":["An anisotropic kernel","An isotropic kernel","A morphological closing","A zonal operation"],"e":"Elongated shapes give a directional preference (anisotropy)."},
 {"q":"Morphological 'opening' consists of:","a":["Erosion followed by dilation","Dilation followed by erosion","Two dilations","A majority filter followed by clumping"],"e":"Opening removes small objects. Closing (dilation then erosion) fills small holes."},
 {"q":"Applying a minimum filter to a Boolean raster performs:","a":["Erosion","Dilation","Closing","Edge detection"],"e":"Min filter shrinks features (erosion); max filter grows them (dilation)."},
 {"q":"Zonal statistics output to a table rather than a raster has the advantage of:","a":["It reports every statistic at once","It displays faster than a raster","It keeps cells aligned to the snap raster","It removes NoData cells automatically"],"e":"The table option gives every statistic for each zone."},
 {"q":"Which Select by Location relationship requires line or polygon inputs?","a":["Share a line segment with","Within a distance geodesic","Have their center in","Completely contains"],"e":"Only lines and polygons have segments to share. The other relationships accept points too."}
],
u4: [
 {"q":"In MCE, a constraint is best described as:","a":["A hard yes/no limit that rules locations in or out","A continuous score of how suitable each location is","A weight that sets a factor's relative importance","A method for putting factors on a common scale"],"e":"Constraints are hard 1/0 limits; factors give relative suitability."},
 {"q":"What is the correct order of the six MCE steps?","a":["Define, Derive, Transform, Weight, Combine, Locate","Derive, Define, Weight, Transform, Locate, Combine","Define, Weight, Derive, Combine, Transform, Locate","Transform, Define, Derive, Combine, Weight, Locate"],"e":"Define → Derive → Transform → Weight → Combine → Locate."},
 {"q":"Raw slope values range from 0 to 20%. Lower slope is better. On a 0–1 scale, what is the normalized score for 5%?","a":["0.75","0.25","0.50","0.80"],"e":"Cost factor: 1 − (5 − 0)/(20 − 0) = 1 − 0.25 = 0.75."},
 {"q":"Distance to roads ranges from 100 m to 1,100 m and farther is better. What is 600 m on a 0–255 scale?","a":["127.5","153.0","100.0","255.0"],"e":"255 × (600 − 100)/(1100 − 100) = 255 × 0.5 = 127.5."},
 {"q":"Which re-scaling method is more sensitive to outliers?","a":["Normalization (min–max)","Standardization (z-score)","Both equally","Neither"],"e":"A single extreme value sets min or max and compresses everything else. Standardization assumes a normal/symmetric distribution."},
 {"q":"Why must MCE factor weights sum to 1?","a":["So the result stays on the same scale as the factors","So constraints can be combined with the factors","So the factors no longer need to be standardized","Because larger values overflow the raster format"],"e":"Weights summing to 1 make the weighted sum a weighted average on the original scale."},
 {"q":"Four criteria are ranked 1 to 4. Using the rank sum method, what is the normalized weight of the rank-1 criterion?","a":["0.40","0.25","0.48","0.10"],"e":"Raw scores n − r + 1 = 4, 3, 2, 1 (sum 10). Rank 1 → 4/10 = 0.40."},
 {"q":"Three criteria; rank exponent with p = 2. What is the normalized weight for rank 1?","a":["0.643","0.500","0.333","0.900"],"e":"(3−r+1)² = 9, 4, 1 (sum 14). 9/14 = 0.643."},
 {"q":"In pairwise comparison, if Population is judged 5 times as important as Roads, the Roads vs. Population cell is:","a":["1/5 (0.2)","5/1 (5.0)","1/1 (1.0)","−5 (−5.0)"],"e":"The matrix is reciprocal."},
 {"q":"After normalizing each column of a pairwise matrix by its column sum, a criterion's weight is found by:","a":["Averaging the values across its row","Summing the values down its column","Taking the largest value in its row","Multiplying the values across its row"],"e":"Row averages of the normalized matrix give the weights."},
 {"q":"A cell has constraint values 1, 1 and 0 and a weighted factor score of 230. Its suitability is:","a":["0","230","76.7","1"],"e":"S = Π constraints × Σ wCr = 0 × 230 = 0."},
 {"q":"Weights 0.5, 0.3, 0.2 are applied to factor scores 100, 200, 50 (all constraints = 1). Suitability =","a":["120","116.7","350","100"],"e":"0.5×100 + 0.3×200 + 0.2×50 = 50 + 60 + 10 = 120."},
 {"q":"In the Suitability Modeler, the preference \"not too dense or sparse, near 45% canopy cover\" would use:","a":["Near","Small","Large","Logistic Growth"],"e":"Specific values preferred: Symmetric Linear, Gaussian, Near."},
 {"q":"Which is a recognized problem with MCE?","a":["Weights are subjective and can drive the result","It leaves constraints out of the model","It requires vector rather than raster inputs","It treats all suitable sites as equal"],"e":"Weights and choice of algorithm are the key issues; PPGIS can help."},
 {"q":"Compared with constraint mapping, MCE:","a":["It ranks relative suitability and can weight criteria","It separates suitable land from unsuitable land","It works best with qualitative, discrete data","It uses weighted factors in place of constraints"],"e":"Constraint mapping is binary; MCE ranks cells and incorporates weights."},
 {"q":"Testing how much the suitability map changes when you adjust weights or transformations is called:","a":["Sensitivity analysis","Model validation","Model calibration","Factor standardization"],"e":"Part of the Analyze step after Locate."}
],
u5: [
 {"q":"Why is Euclidean distance inadequate for planning a road through varied terrain?","a":["It assumes every cell costs the same to cross","It cannot be calculated on a raster surface","It overestimates the true distance travelled","It needs geographic (lat/long) coordinates"],"e":"Euclidean distance is isotropic. Cost distance adds spatially varying friction."},
 {"q":"Geodesic distance is most appropriate when:","a":["Features span multiple UTM zones or large regions","Data are in a projected system over a small area","Travel follows a grid of city streets or blocks","Raster buffers are built at a fine cell size"],"e":"Geodesic distance accounts for the ellipsoid; Euclidean suits small projected areas."},
 {"q":"Manhattan distance from (2, 3) to (7, 9) is:","a":["11","7.81","5","30"],"e":"|7−2| + |9−3| = 5 + 6 = 11. (Euclidean = √61 ≈ 7.81.)"},
 {"q":"Each cell of a cost (friction) surface represents:","a":["Cost of crossing one unit of distance in that cell","Total cost of travel from the source to that cell","Direction to the next cell on the cheapest path","Elevation of the cell used to compute the slope"],"e":"The accumulated surface holds totals; the back-link holds directions."},
 {"q":"Cell i has an accumulated cost of 20 and a cost value of 6. Its orthogonal (side) neighbour j has a cost value of 4, as shown below. What is the accumulated cost of j when reached from i?","a":["25","30","27.07","22"],"e":"Orthogonal move: aⱼ = aᵢ + (costᵢ + costⱼ)/2 = 20 + (6 + 4)/2 = 25.","ctx":"<div class=\"ctx-scroll\"><table class=\"cgrid\"><tr><td><b>i</b><span>cost 6</span><span>accum. 20</span></td><td><b>j</b><span>cost 4</span><span>accum. ?</span></td></tr><tr><td><span class=\"dim\">·</span></td><td><span class=\"dim\">·</span></td></tr></table></div><div class=\"ctx-note\">Cells are 1 unit apart, centre to centre</div>"},
 {"q":"Cell i has an accumulated cost of 20 and a cost value of 6. Its diagonal neighbour j has a cost value of 4, as shown below. What is the accumulated cost of j when reached from i?","a":["27.07","25","34.14","30"],"e":"Diagonal neighbours are √2 ≈ 1.414 units apart: aⱼ = 20 + 1.414 × (6 + 4)/2 = 20 + 7.07 = 27.07.","ctx":"<div class=\"ctx-scroll\"><table class=\"cgrid\"><tr><td><b>i</b><span>cost 6</span><span>accum. 20</span></td><td><span class=\"dim\">·</span></td></tr><tr><td><span class=\"dim\">·</span></td><td><b>j</b><span>cost 4</span><span>accum. ?</span></td></tr></table></div><div class=\"ctx-note\">Cells are 1 unit apart orthogonally, centre to centre</div>"},
 {"q":"What is the purpose of the back-link (back direction) raster?","a":["To trace the cheapest route back to the source","To store the per-unit travel cost of each cell","To mark which cells act as absolute barriers","To normalize cost factors onto a common scale"],"e":"It encodes each cell's discovering neighbour, the next step toward the source."},
 {"q":"The least-cost path is traced on the accumulated cost surface by:","a":["Steepest descent from the target to the source","Steepest ascent from the source to the target","Following the cells with the highest cost","A straight line from the source to the target"],"e":"Sources are the lowest points (0) on the accumulation surface."},
 {"q":"Cost allocation only makes sense when:","a":["There is more than one source","There is a single source","The cost surface is uniform","Distances are geodesic"],"e":"Allocation assigns each cell to its least-cost source (area of capture)."},
 {"q":"Why are single-cell-wide streams often thickened with a 3×3 maximum filter before building a cost surface?","a":["To stop paths slipping diagonally through them","To reduce the file size of the cost raster","To prepare streams for conversion to vectors","To remove small streams from the cost surface"],"e":"Diagonal connectivity can let a path cross between two diagonally adjacent barrier cells."},
 {"q":"A cost surface for a new road between two highways was built from the factors below. Why weren't these factors normalized to a common scale before they were combined?","a":["All factors were already in the same units","Normalization only applies to MCE suitability","There was only one factor in the cost surface","The DEM handled the scaling automatically"],"e":"Every factor is already a cost in $/m, a common objective unit, so they can be added directly and their relative importance is built in.","ctx":"<div class=\"ctx-scroll\"><table class=\"cm\"><tr><th>Factor</th><th>Cost</th></tr><tr><th>Privately owned land</th><td>$100,000 / m</td></tr><tr><th>Small stream (culvert)</th><td>$500 / m</td></tr><tr><th>Medium stream (small bridge)</th><td>$5,000–10,000 / m</td></tr><tr><th>Large river</th><td>$1,000,000 / m</td></tr><tr><th>Wetland</th><td>$1,000,000 / m</td></tr><tr><th>Slope 0–5° / 5–10° / 10–15°</th><td>$1,000 / $2,000 / $3,000 per m</td></tr><tr><th>Slope > 15°</th><td>$100,000 / m</td></tr></table></div>"},
 {"q":"Which is the correct order of LCPA steps?","a":["Cost surface → sources → accumulation + back-link → path","Sources → path → cost surface → accumulation + back-link","Accumulation + back-link → cost surface → path → sources","Cost surface → accumulation + back-link → sources → path"],"e":"Build the cost surface, specify sources/targets, run cost accumulation (with back-link), then trace the path. Accumulation needs the sources first."},
 {"q":"Wetlands that should be avoided if possible, but not strictly prohibited, are best treated as:","a":["High but passable cost values","An absolute barrier or mask","Source cells for accumulation","Zero cost so paths use them"],"e":"Absolute barriers get prohibitive costs or masks; soft constraints get high but passable costs."},
 {"q":"Which is NOT a typical application of least-cost path analysis?","a":["Calculating NDVI","Pipeline routing","Wildlife corridor connectivity","Recreational trail planning"],"e":"NDVI is a raster band ratio."},
 {"q":"In the Spread accumulation procedure, after assigning the source 0 and calculating its neighbours, the algorithm next:","a":["Visits the lowest-cost unvisited cell and expands from it","Visits the highest-cost cell and expands from it","Draws a straight line toward the target cell","Rescales all accumulated values to a 0–1 range"],"e":"It expands outward from the lowest accumulated values."}
],
u6: [
 {"q":"Under Chang's (2016) classification, an MCE suitability model is a(n):","a":["Index model","Binary model","Regression model","Process model"],"e":"Index models combine weighted, rated layers into a suitability index."},
 {"q":"Selecting parcels within 500 m of a road AND outside the floodplain is a(n):","a":["Binary model","Index model","Process model","Regression model"],"e":"Boolean logic = binary model."},
 {"q":"RUSLE, SWAT and MODFLOW are examples of:","a":["Process models","Binary models","Index models","Cellular automata"],"e":"They simulate environmental processes with equations."},
 {"q":"Which regression approach lets relationships vary across the study area?","a":["Geographically Weighted Regression","Multiple Linear Regression","Ordinary Least Squares regression","Binary logistic regression"],"e":"GWR estimates local relationships."},
 {"q":"Predicting landslide presence/absence from slope and soil would use:","a":["Logistic regression","Multiple linear regression","A binary overlay model","Cellular automata"],"e":"Logistic regression predicts binary outcomes."},
 {"q":"A model that produces a single exact output from fixed inputs, with no randomness, is:","a":["Deterministic","Stochastic","Prescriptive","Inductive"],"e":"Stochastic models include randomness and give a range of outcomes."},
 {"q":"A model built bottom-up from observed data to derive general rules is:","a":["Inductive","Deductive","Prescriptive","Static"],"e":"Inductive = data-driven/empirical; deductive = theory-driven."},
 {"q":"A model designed to find the optimal course of action for a future state is:","a":["Prescriptive","Descriptive","Static","Deterministic"],"e":"Descriptive models represent existing conditions."},
 {"q":"Which correctly orders the modelling process?","a":["Define goals → define system → implement → validate","Validate → implement → define system → define goals","Define system → validate → define goals → implement","Define goals → implement → define system → validate"],"e":"Define goals → define the system → implement (calibration, sensitivity analysis) → validate."},
 {"q":"Preparing a DEM in ArcGIS, exporting rasters as ASCII grids, running MODFLOW separately, then importing results is:","a":["Loose coupling","Tight coupling","Mosaic integration","Cellular automata"],"e":"Separate packages with manual file exchange = loosely coupled."},
 {"q":"Running Cost Distance and Flow Accumulation natively within ArcGIS Pro's Spatial Analyst is an example of:","a":["Tight coupling","Loose coupling","Interactive interface integration","A stochastic model"],"e":"Model and GIS share one environment."},
 {"q":"Which dynamic-model integration approach has the disadvantage that \"GIS functions may be insufficient for complex models\"?","a":["Mosaic integration","Loose integration","Interactive interface","Tight coupling via file export"],"e":"Mosaic: one system and common database; no data exchange issues, but GIS functions may be limited."},
 {"q":"Which integration approach needs no modification of the model code but has high data-conversion effort?","a":["Loose integration","Mosaic integration","Interactive interface","Embedded GIS functions"],"e":"Loose integration: GIS preprocesses and exports; results are imported back."},
 {"q":"Which is NOT a characteristic of cellular automata?","a":["Continuous time steps","A regular grid of cells","A finite number of states","Transition rules based on neighbours"],"e":"In CA, space, time and states are all discrete."},
 {"q":"Using the linear distance-decay model w = a − bd with a = 100, b = 2, d = 10, w equals:","a":["80","98","120","20"],"e":"100 − 2×10 = 80."},
 {"q":"Using the exponential model w = e^(−bd) with b = 0.2 and d = 10, w ≈","a":["0.135","0.818","2.0","0.368"],"e":"e^(−2) ≈ 0.135."},
 {"q":"Which system component typically changes the slowest?","a":["Topography","Land cover","Soil moisture","Temperature"],"e":"Topography (very slow) → land cover (years) → soil moisture (weeks) → temperature (hours)."},
 {"q":"Historically, GIS has mainly supported process models by:","a":["Creating model inputs and displaying outputs","Solving all of the model equations internally","Replacing process models with overlay analysis","Supplying random numbers for stochastic runs"],"e":"Most commercial GIS lack built-in process modelling (ILWIS is an exception)."}
],
lab1: [
 {"q":"Which is NOT a limitation of the shapefile format?","a":["It cannot store a coordinate system","Field names are limited to 10 characters","Each layer is limited to 2 GB","It is non-topological"],"e":"The .prj file stores projection information."},
 {"q":"In a shapefile, attribute data are stored in the:","a":[".dbf",".shp",".prj",".gdb"],"e":".shp = geometry, .dbf = attributes, .prj = projection."},
 {"q":"Which geodatabase type is a single SQLite file with a 2 TB maximum?","a":["Mobile geodatabase","File geodatabase","Enterprise geodatabase","Personal shapefile database"],"e":"File geodatabases are .gdb folders; enterprise geodatabases live in an RDBMS."},
 {"q":"A feature dataset is:","a":["Feature classes that share one coordinate system","A folder holding rasters, tables and feature classes","A single feature class with topology rules applied","Another name for a group of related shapefiles"],"e":"Rasters and standalone tables cannot go in a feature dataset."},
 {"q":"To build a geodatabase topology, the feature classes must be:","a":["Stored in the same feature dataset","Stored as separate shapefiles","Stored in different geodatabases","Converted to raster datasets first"],"e":"Feature datasets enable topology, network datasets, terrains and parcel fabrics."},
 {"q":"The XY (cluster) tolerance is:","a":["Distance within which vertices are treated as coincident","The number of decimal places shown in the attribute table","The maximum file size allowed for a single feature class","The precision used to store elevation (z) coordinate values"],"e":"XY resolution is the storage precision; XY tolerance controls snapping."},
 {"q":"Two points are 1.81 m apart. XY resolution = 0.01 m, XY tolerance = 1.5 m. When imported:","a":["They stay as two separate points","They snap together into one point","Both points are rejected on import","They keep all six decimal places"],"e":"1.81 m > 1.5 m tolerance, so they don't cluster. Coordinates are rounded to the 0.01 m resolution."},
 {"q":"Which SQL expression selects all zones whose ZONEMAP value begins with R?","a":["ZONEMAP LIKE 'R%'","ZONEMAP = 'R'","ZONEMAP LIKE '%R'","ZONEMAP IN ('R')"],"e":"% is the wildcard; 'R%' = starts with R."},
 {"q":"To find residential addresses farther than 2 km from a fire station with 'Within a distance' (2 km), after first selecting residential addresses, you should:","a":["Invert the spatial relationship; subset the current selection","Don't invert; create a new selection from all addresses","Invert the spatial relationship; create a new selection","Don't invert the relationship; subset the current selection"],"e":"Invert gives features NOT within 2 km; 'subset' keeps the search inside the residential selection."},
 {"q":"Which single topology rule identifies gaps, overshoots and undershoots between bike lane lines?","a":["Must Not Have Dangles","Must Not Overlap","Must Be Properly Inside","Must Not Have Gaps (polygon)"],"e":"Unconnected line endpoints (dangles) result from all three problems."},
 {"q":"A dangle at the true end of a bike trail on the edge of the network should be:","a":["Marked as an exception","Deleted from the dataset","Snapped to the nearest line","Merged with another feature"],"e":"Valid cases are marked as exceptions in the Error Inspector."},
 {"q":"Why set environment settings before running analysis?","a":["So outputs share one workspace, coordinate system and extent","So basemaps draw faster while geoprocessing tools run","Because topology rules depend on them being set","Because they control how map layouts are exported"],"e":"Environment settings apply to all geoprocessing tools, so outputs land where expected with consistent projection, extent and alignment."},
 {"q":"A spatial join of Zoning (polygons) to Addresses (points) will:","a":["Attach the zone attributes to each address inside it","Merge all address points into a single feature","Clip the zoning polygons to the address extent","Create a buffer polygon around every address"],"e":"Spatial joins transfer attributes based on location."}
],
lab2: [
 {"q":"In Lab 2, which was treated as a constraint rather than a criterion?","a":["Elevation must not exceed 475 m","Higher elevation is better","Slope near 2.5% is ideal","Farther from existing campsites is better"],"e":"Elevation appears as both: the 475 m limit is a constraint; higher-is-better is a criterion."},
 {"q":"A canoe waterbody was defined as:","a":["Any waterbody within 50 m of a portage trail","Any waterbody larger than 1 km²","Any waterbody within 200 m of a campsite","Any waterbody touching the park boundary"],"e":"Campsites could not be within 200 m of canoe waterbodies."},
 {"q":"Multiplying three 1/NoData constraint masks in the Raster Calculator produces:","a":["1 where all three masks are 1, NoData elsewhere","The sum of the three masks, ranging from 1 to 3","0 wherever any of the masks contains NoData","A continuous suitability surface from 0 to 1"],"e":"1 × NoData = NoData."},
 {"q":"Which Suitability Modeler transform was used for percent slope (ideal 2.5%, acceptable 0–5%)?","a":["Symmetric Linear","Logistic Growth","Logistic Decay","Large"],"e":"A specific value is preferred, so Symmetric Linear with min 0, max 5."},
 {"q":"Distance from existing campsites was transformed with:","a":["Large","Small","Near","Gaussian"],"e":"Farther is better, so larger values get higher scores."},
 {"q":"The 'Snap raster' environment setting:","a":["Aligns output cells to another raster's grid","Sets cells outside the study area to NoData","Defines the cell size of every output raster","Sets the coordinate system of every output"],"e":"Mask sets NoData outside an area; cell size sets resolution."},

// Short-answer pool (Part 3). Self-graded against key points; 3 points each.
const SHORT = [
 {cat:"u2", q:"Distinguish between accuracy and precision in geospatial data. Describe a situation where a dataset could be very precise but not accurate.", model:"Accuracy is how closely data correspond to reality (how true they are), while precision is how exact the measurements are or how finely they are reported, for example the number of decimal places. A dataset can be very precise but inaccurate when a systematic error is present, for example GPS points recorded to the millimetre but all shifted 10 m because the wrong datum was used, or an instrument that is miscalibrated.", points:["Accuracy = closeness to the true value / reality","Precision = exactness / repeatability / decimal places","Example of precise-but-inaccurate with systematic bias (wrong datum, miscalibration, etc.)"]},
 {cat:"u2", q:"What is the Modifiable Areal Unit Problem (MAUP)? Name and briefly explain its two forms.", model:"The MAUP occurs when continuous phenomena are aggregated into arbitrary spatial units, so the results of an analysis depend on how the units are drawn rather than only on the data. The scale effect is when results change because the size of the units changes (e.g., county vs. census tract). The zone effect is when the unit size stays the same but their shape or arrangement changes (e.g., square vs. hexagon grids, or redrawn electoral boundaries).", points:["Arbitrary aggregation units change analysis results","Scale effect = changing size/level of units","Zone effect = same size, different shape/boundaries"]},
 {cat:"u2", q:"Explain the ecological fallacy and give an example.", model:"The ecological fallacy is the error of inferring characteristics of individuals from data aggregated for a group or area. For example, if lower-income counties have higher crime rates, we cannot conclude that lower-income individuals are more likely to commit crimes; we can only say that lower-income counties tend to have higher crime. Conclusions apply only at the scale of aggregation.", points:["Definition: inferring individual traits from aggregate/group data","Valid example (income/crime, wealthy neighbourhood, etc.)","Conclusions only hold at the aggregation scale"]},
 {cat:"u2", q:"Compare producer's accuracy and user's accuracy. What type of error does each reflect?", model:"Producer's accuracy is the number of correctly classified samples of a class divided by the total observed (reference) samples of that class, i.e., the column total. It is the probability that a real feature was mapped correctly and is inversely related to errors of omission. User's accuracy divides correct samples by the total predicted (mapped) for that class, the row total. It is the probability that a mapped feature is actually that class and is inversely related to errors of commission.", points:["Producer's = correct ÷ reference/observed total","User's = correct ÷ predicted/map total","Producer's ↔ omission; user's ↔ commission"]},
 {cat:"u2", q:"Explain the difference between additive and transformational error propagation, and name a method used to quantify how error propagates.", model:"In additive propagation, errors from successive steps accumulate, e.g., a DEM with ±5 m vertical error interpolated with ±1.5 m error gives about ±6.5 m total. In transformational propagation, errors change in form or magnitude when data are transformed, such as projecting data (distorting geometry) or resampling a raster (smoothing or amplifying noise). Monte Carlo (stochastic) simulation can quantify propagation by running the workflow many times with randomly perturbed inputs.", points:["Additive = errors accumulate/sum through steps","Transformational = errors change form/magnitude via projection, resampling, etc.","Monte Carlo / stochastic simulation"]},
 {cat:"u2", q:"What is topology in a GIS, and what are two benefits of storing topological relationships?", model:"Topology describes the spatial relationships between features (adjacency, connectivity, containment) that stay invariant under transformations like bending or stretching. It is built from nodes, edges and faces. Storing topology helps ensure data quality by detecting and fixing errors like dangles, overshoots, gaps and overlaps through rules, and it enhances analysis, such as network analysis that relies on connectivity. It can also reduce redundant geometry.", points:["Definition: relationships between features (adjacency, connectivity, containment) / invariant properties","Benefit 1: data quality / error detection via rules","Benefit 2: enables analysis (e.g., networks) or reduces storage"]},
 {cat:"u3", q:"Explain the difference between Queen's case and Rook's case connectivity in clumping, and why a clumped raster should be displayed with a random palette.", model:"Queen's case counts diagonal neighbours as connected (8 neighbours), while Rook's case counts only the four edge-sharing neighbours, so Rook's case produces the same number or more clumps because diagonally touching groups are split. Clump IDs are nominal labels with no order, so a graduated colour ramp would imply a false ranking and make adjacent clumps with similar IDs look alike; a random qualitative palette makes each clump distinct.", points:["Queen = 8 neighbours incl. diagonals; Rook = 4","Rook's yields same or more clumps","IDs are nominal; graduated ramp implies false order / poor distinction"]},
 {cat:"u3", q:"Describe the difference between local, focal and zonal raster operations, with an example of each.", model:"Local operations compute each output cell from only the same cell location in one or more inputs, for example map algebra like Elevation > 400 or adding two rasters. Focal operations use a neighbourhood around each cell, such as a 3×3 mean or majority filter. Zonal operations summarize values within zones defined by another layer, such as the mean elevation within each watershed (zonal statistics).", points:["Local = cell-by-cell + example","Focal = neighbourhood/kernel + example","Zonal = summary within zones from another layer + example"]},
 {cat:"u3", q:"What is the difference between morphological opening and closing, and when would you use each?", model:"Opening is an erosion followed by a dilation; it removes small isolated objects or noise and breaks thin connections while keeping the size and shape of larger features. Closing is a dilation followed by an erosion; it fills small holes and gaps and smooths contours. Use opening to clean speckle from a Boolean classification and closing to fill gaps inside features.", points:["Opening = erosion then dilation","Closing = dilation then erosion","Correct use: opening removes small objects/noise; closing fills holes/gaps"]},
 {cat:"u4", q:"Distinguish between constraints and factors in a multi-criteria evaluation, and explain how each is combined in the final suitability calculation.", model:"Constraints are Boolean limits that absolutely include (1) or exclude (0/NoData) locations, such as not within 200 m of a river. Factors (criteria) measure relative suitability on a continuous, standardized scale, such as distance to roads. Constraints are multiplied together, and that product multiplies the weighted sum of the standardized factors: S = Πc × Σw·Cr. Any constraint of 0 makes a cell unsuitable, while a low factor can be offset by other factors.", points:["Constraints = Boolean hard limits (1/0)","Factors = continuous relative suitability, standardized and weighted","S = product of constraints × weighted sum of factors (0 constraint eliminates; factors trade off)"]},
 {cat:"u4", q:"Why must factors be standardized before an MCE, and how do normalization and standardization differ?", model:"Factors are measured in different units (slope in degrees, distance in metres), so they must share a common scale before they can be weighted and summed. Normalization rescales values using the min and max onto a new range such as 0–1 or 0–255. It is most common but sensitive to outliers. Standardization uses the mean and standard deviation (z = (x − μ)/σ) and assumes roughly normal or symmetric data.", points:["Different units/scales need a common scale to be combined","Normalization = min–max rescale (sensitive to outliers)","Standardization = z-score with mean/SD (assumes normal distribution)"]},
 {cat:"u4", q:"Compare ranking methods with the pairwise comparison method for assigning MCE weights. What advantage does pairwise comparison offer?", model:"Ranking methods (rank sum, reciprocal, exponent) order the criteria and convert the ranks to weights with a formula, so they capture order but not how much more important one criterion is than another. Pairwise comparison judges each pair of criteria on a scale such as 1–9, normalizes each column, and averages the rows. Its advantage is that it allows irregular differences between criteria, for example two nearly equal factors, and forces careful head-to-head judgements.", points:["Ranking = order converted to weights by formula; only order known","Pairwise = compare each pair on a 1–9 scale; normalize columns, average rows","Advantage: captures relative magnitude / irregular differences"]},
 {cat:"u4", q:"Identify two limitations of multi-criteria evaluation and suggest how one could be addressed.", model:"First, the choice of MCE algorithm is hard to justify, and different algorithms give different results. Second, weights are subjective, the outcome can depend heavily on them, and different interest groups may weight criteria differently. This can be addressed with sensitivity analysis to test how results change with weights, or with public participation GIS (PPGIS) to involve stakeholders in setting weights.", points:["Limitation: choice of algorithm","Limitation: subjective weights / sensitivity to weights","Remedy: sensitivity analysis or PPGIS"]},
 {cat:"u5", q:"Describe the steps of least-cost path analysis and the role of the back-link (back direction) raster.", model:"First, build a cost surface where each cell's value is the cost of moving one unit of distance through it. Second, specify source and target cells. Third, run cost accumulation, which spreads outward from the source to give each cell the minimum total cost back to the source, while recording the back-link raster. Finally, trace the least-cost path from the target down the accumulation surface. The back-link stores the direction of the next cell toward the source, which lets the path be traced.", points:["Cost surface → sources/targets","Cost accumulation (spread from source, minimum cumulative cost)","Back-link records direction to the next cell; used to trace path from target to source"]},
 {cat:"u5", q:"Why should thin linear barriers such as streams be thickened before building a cost surface? How can this be done?", model:"In a raster, a single-cell-wide barrier can be crossed diagonally, because the path can move between two diagonally adjacent barrier cells without entering either, so the least-cost path may slip through a high-cost feature. Thickening the barrier, for example with a 3×3 maximum filter (dilation), closes these diagonal gaps so the barrier is respected.", points:["Diagonal connectivity lets paths leak through one-cell-wide barriers","Path incorrectly crosses high-resistance feature","Fix: 3×3 maximum filter / dilation to make barriers 'fat'"]},
 {cat:"u5", q:"Explain why Euclidean distance is called isotropic and why cost distance is needed for problems such as road or trail planning.", model:"Euclidean distance is isotropic because it assumes moving through any cell costs the same in every direction and location; only straight-line length matters. Real landscapes are heterogeneous: crossing rivers, steep slopes, wetlands or private land costs more. Cost distance applies a friction surface so distance is weighted by the spatially varying cost, giving the route that minimizes total cost rather than length.", points:["Isotropic = uniform cost everywhere / all directions","Landscapes vary (slope, water, land value)","Cost distance weights distance by a friction surface to minimize cumulative cost"]},
 {cat:"u6", q:"Distinguish between loosely coupled and tightly coupled GIS models, giving an example of each.", model:"In a loosely coupled approach the GIS and model are separate software packages: GIS prepares inputs that are exported (often reformatted) to the model, and outputs are imported back for display. Examples are preparing rasters in ArcGIS for MODFLOW or HEC-RAS. In a tightly coupled approach the model runs within the GIS with a shared interface and seamless workflow, such as Cost Distance or Flow Accumulation in ArcGIS Spatial Analyst, or a ModelBuilder workflow.", points:["Loose = separate software, file export/import","Tight = integrated in same environment, shared interface","Correct example of each"]},
 {cat:"u6", q:"Describe the four types of GIS models identified by Chang (2016).", model:"Binary models use Boolean logic (AND/OR/NOT) to select areas that meet conditions, such as overlay for siting. Index models assign weights and ratings to layers and combine them into a suitability or vulnerability index, as in MCE. Regression models use statistical relationships between dependent and independent variables to predict outcomes (MLR, logistic, GWR). Process models simulate environmental processes with equations, often dynamically, such as RUSLE or SWAT.", points:["Binary (Boolean) and index (weighted/MCE)","Regression (statistical prediction)","Process (equations of physical processes)"]},
 {cat:"u6", q:"What is a cellular automaton? Describe its components and one GIS application.", model:"A cellular automaton is a discrete dynamic model in which space, time and states are all discrete. It has a regular grid of cells, each in one of a finite number of states. Each time step, every cell checks the states of its neighbours (4 or 8) and applies simple transition rules to set its next state. In GIS it is used for urban growth, where cells near roads or built-up land are more likely to become developed, and for forest fire spread.", points:["Discrete space/time/states on a regular grid","Neighbourhood + transition rules determine next state","Valid application (urban growth, wildfire, land-use change, etc.)"]},
 {cat:"u6", q:"Compare deterministic and stochastic models, and explain how stochastic modelling relates to studying error in GIS.", model:"A deterministic model always produces the same single result from a given set of inputs because it contains no randomness. A stochastic model incorporates random variables and probabilities, so repeated runs produce a range of possible outcomes. Stochastic (Monte Carlo) simulation can study error propagation by running a model many times with randomly perturbed inputs (e.g., DEM error) to map the probability or uncertainty of the output, such as the probability a cell lies in a watershed.", points:["Deterministic = single exact output, no randomness","Stochastic = randomness, range of outcomes","Monte Carlo runs many realizations to quantify uncertainty/error propagation"]},
 {cat:"lab1", q:"Give three advantages of the file geodatabase over the shapefile format, and explain what a feature dataset is.", model:"A file geodatabase can store many layers, including rasters and standalone tables, in one container. It has much larger size limits (1 TB per dataset vs. 2 GB) and no 10-character field-name limit. It supports richer data types, domains and subtypes, and explicit topology rules. A feature dataset is a collection of feature classes within a geodatabase that share a common coordinate system; it is needed to build topologies, network datasets or terrains.", points:["Any three valid advantages (multiple layers/rasters/tables, size, field names, domains/subtypes, topology, dates)","Feature dataset = feature classes sharing a coordinate system","Feature datasets enable topology/networks"]},
 {cat:"lab1", q:"Explain the difference between XY resolution and XY tolerance. What happens if two points 1.8 m apart are imported with an XY tolerance of 1.5 m?", model:"XY resolution is the precision at which coordinates are stored, the fine grid that coordinate values are rounded to. XY (cluster) tolerance is the minimum distance between coordinates before they are considered coincident and snapped together. Points 1.8 m apart with a 1.5 m tolerance are farther apart than the tolerance, so they stay as two separate points, though their coordinates are rounded to the resolution.", points:["Resolution = storage precision of coordinates","Tolerance = distance within which coordinates are considered coincident","Points remain separate because 1.8 > 1.5"]},
 {cat:"lab2", q:"In Lab 2, why was the waterbody cost set to a value larger than the number of cells on the raster's diagonal? Give one reason for and one against dilating the waterbodies first.", model:"The diagonal is the longest straight path across the raster, so with land costs around 1 per cell, a water cost greater than √(cols² + rows²) means entering even one water cell costs more than any all-land route. The path will avoid water unless there is no alternative. Dilating water prevents paths leaking diagonally between water cells and keeps the trail back from shorelines. However, dilation can close narrow land bridges between lakes and remove valid routes.", points:["Water cell more costly than any all-land route across raster","Pro dilation: stop diagonal leakage / shoreline setback","Con dilation: close narrow land bridges / lose valid routes"]},
 {cat:"lab2", q:"Explain why the Lab 2 constraint masks were built as 1/NoData rasters and combined by multiplication.", model:"Each constraint mask gives 1 to cells that meet the constraint and NoData to cells that fail it. In map algebra 1 × 1 = 1 but 1 × NoData = NoData, so multiplying the three masks in the Raster Calculator leaves 1 only where all constraints are satisfied. That final mask is then applied to the suitability model so only permissible cells are evaluated, matching the Πc term of the MCE equation.", points:["Mask cells: 1 = passes, NoData = fails","1 × NoData = NoData, so product keeps only cells passing all constraints","Final mask applied to suitability model (Πc)"]}
];

<script>
(function(){
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("g3480:" + k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const LET = "ABCDEFGH";
function scalebar(frac, segs){ segs = segs || 10; const on = Math.round(frac * segs); let h = '<div class="scalebar" aria-hidden="true">'; for(let i = 0; i < segs; i++) h += `<i class="${i < on ? "on" + (i % 2 ? " alt" : "") : ""}"></i>`; return h + "</div>"; }
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

/* ---------- Routing ---------- */
const VIEWS = ["home", "read", "cards", "quiz", "exam"];
let current = null;
function go(v, opts){

  RENDER[v](opts || {});
  if(!(opts && opts.keepScroll)) window.scrollTo(0, 0);
}
document.addEventListener("click", e => {

function knownSet(){ return new Set(store.get("known", [])); }
function totalCards(){ return Object.values(CARDS).reduce((n, a) => n + a.length, 0); }

/* Decorative contour lines (marching squares on a seeded field) */
function drawContours(){
  const cv = $("#contours"); if(!cv) return;
  const r = cv.getBoundingClientRect(); if(!r.width) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  let seed = 3480; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const blobs = []; for(let i = 0; i < 7; i++) blobs.push({x: .45 + rnd() * .6, y: rnd() * 1.1 - .05, s: .08 + rnd() * .22, a: (rnd() > .25 ? 1 : -.6) * (.6 + rnd())});
  const W = r.width, H = r.height, step = 12;
  const nx = Math.ceil(W / step) + 1, ny = Math.ceil(H / step) + 1;
  const f = new Float32Array(nx * ny);
  for(let j = 0; j < ny; j++) for(let i = 0; i < nx; i++){
    const x = i * step / W * (W / H) * .9, y = j * step / H; let v = 0;
    for(const b of blobs){ const dx = x - b.x * (W / H) * .9, dy = y - b.y; v += b.a * Math.exp(-(dx * dx + dy * dy) / (2 * b.s * b.s)); }
    f[j * nx + i] = v;
  }
  const col = getComputedStyle(document.documentElement).getPropertyValue("--contour").trim() || "#9A6B3F";
  ctx.strokeStyle = col; ctx.lineCap = "round";
  const levels = []; for(let L = .15; L < 2.4; L += .15) levels.push(L);
  levels.forEach((L, li) => {
    ctx.globalAlpha = li % 5 === 4 ? .38 : .17; ctx.lineWidth = li % 5 === 4 ? 1.3 : .8;
    ctx.beginPath();
    for(let j = 0; j < ny - 1; j++) for(let i = 0; i < nx - 1; i++){
      const a = f[j*nx+i], b = f[j*nx+i+1], c = f[(j+1)*nx+i+1], d = f[(j+1)*nx+i];
      const idx = (a > L ? 8 : 0) | (b > L ? 4 : 0) | (c > L ? 2 : 0) | (d > L ? 1 : 0);
      if(idx === 0 || idx === 15) continue;
      const x = i * step, y = j * step, t = (p, q) => (L - p) / (q - p);
      const T = [x + step * t(a, b), y], R = [x + step, y + step * t(b, c)], B = [x + step * t(d, c), y + step], Lf = [x, y + step * t(a, d)];
      const segs = {1:[[Lf,B]],2:[[B,R]],3:[[Lf,R]],4:[[T,R]],5:[[Lf,T],[B,R]],6:[[T,B]],7:[[Lf,T]],8:[[Lf,T]],9:[[T,B]],10:[[Lf,B],[T,R]],11:[[T,R]],12:[[Lf,R]],13:[[B,R]],14:[[Lf,B]]}[idx];
      segs.forEach(s => { ctx.moveTo(s[0][0], s[0][1]); ctx.lineTo(s[1][0], s[1][1]); });
    }
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if(current === "home") drawContours(); }, 150); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(current === "home") drawContours(); }); }catch(e){}
try{ new MutationObserver(() => { if(current === "home") drawContours(); }).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]}); }catch(e){}

        </div>
      </article>
    </div>
  </div>`;
  $$("#view-read [data-sec]").forEach(b => b.addEventListener("click", () => go("read", {arg: b.dataset.sec})));
  $("#tocSel").addEventListener("change", e => go("read", {arg: e.target.value}));
  $("#readMark").addEventListener("change", e => {
    const d = new Set(store.get("readDone", []));

    const b = $(`.toc [data-sec="${sec}"]`);
    if(b){ const t = b.querySelector(".tick"); if(e.target.checked && !t) b.insertAdjacentHTML("beforeend", '<span class="tick">✓</span>'); if(!e.target.checked && t) t.remove(); }
  });
}

/* ---------- FLASHCARDS ---------- */
const FC = {deck: "all", mode: "all", order: [], i: 0, flipped: false, sessionKnown: 0, sessionLearn: 0, done: false};
function cardById(id){ const [c, n] = id.split(":"); return {cat: c, f: CARDS[c][+n][0], b: CARDS[c][+n][1]}; }
function buildDeck(shuf){
  const cats = FC.deck === "all" ? CATS.map(c => c.id) : [FC.deck];
  const known = knownSet();
  let ids = []; cats.forEach(c => CARDS[c].forEach((_, n) => ids.push(c + ":" + n)));
  if(FC.mode === "learning") ids = ids.filter(id => !known.has(id));
  FC.order = shuf ? shuffle(ids) : ids; FC.i = 0; FC.flipped = false; FC.sessionKnown = 0; FC.sessionLearn = 0; FC.done = false;
}
function renderCards(opts){
  if(opts && opts.arg && CAT[opts.arg]){ FC.deck = opts.arg; buildDeck(false); }
  else if(!FC.order.length && !FC.done) buildDeck(false);
  const el = $("#view-cards");
  const known = knownSet();
  const deckIds = []; (FC.deck === "all" ? CATS.map(c => c.id) : [FC.deck]).forEach(c => CARDS[c].forEach((_, n) => deckIds.push(c + ":" + n)));
  const deckKnown = deckIds.filter(id => known.has(id)).length;
  let body;
  if(!FC.order.length){
    body = `<div class="sheet pad" style="max-width:760px;margin:0 auto;text-align:center"><h2 style="font-size:1.4rem">Nothing left to learn in this deck</h2><p class="small">Every card here is marked "Got it." Switch to all cards to review them again, or reset the deck.</p><div class="row" style="justify-content:center"><button class="btn primary" id="fcAll">Show all cards</button><button class="btn" id="fcReset">Reset this deck</button></div></div>`;
  } else if(FC.done){
    body = `<div class="sheet pad" style="max-width:760px;margin:0 auto;text-align:center"><div class="eyebrow">Deck complete</div><div class="result-big" style="margin:10px 0">${FC.sessionKnown} / ${FC.order.length}</div><p class="small">marked "Got it" this round · ${FC.sessionLearn} still learning</p><div class="row" style="justify-content:center;margin-top:10px">${FC.sessionLearn ? '<button class="btn primary" id="fcAgainLearn">Review the cards still learning</button>' : ""}<button class="btn" id="fcRestart">Go through again (shuffled)</button></div></div>`;
  } else {
    const c = cardById(FC.order[FC.i]);
    const isKnown = known.has(FC.order[FC.i]);
    body = `
    <div class="deck-progress"><div class="row"><span class="mono">Card ${FC.i + 1} of ${FC.order.length}</span><span>${deckKnown} / ${deckIds.length} known in this deck</span></div>${scalebar((FC.i) / FC.order.length, 10)}</div>
    <div class="flip ${FC.flipped ? "is-flipped" : ""}" id="flip" tabindex="0" role="button" aria-label="Flashcard. Press space to flip.">
      <div class="flip-inner">
        <div class="face front"><div class="meta"><span>${sw(c.cat)} ${CAT[c.cat].code} · ${CAT[c.cat].name}</span><span>${isKnown ? '<span class="pill ok">Known</span>' : ""}</span></div><div class="term">${esc(c.f)}</div><div class="hint">Click or press <span class="kbd">Space</span> to flip</div></div>
        <div class="face back"><div class="meta"><span>${sw(c.cat)} ${esc(c.f)}</span><span></span></div><div class="def">${esc(c.b)}</div><div class="hint"><span class="kbd">←</span> still learning · <span class="kbd">→</span> got it</div></div>
      </div>
    </div>
    <div class="card-actions">
      <button class="btn learn" id="fcLearn">Still learning</button>
      <button class="btn know" id="fcKnow">Got it</button>
    </div>
    <div class="row" style="justify-content:center;margin-top:12px">
      <button class="btn ghost" id="fcBack" ${FC.i === 0 ? "disabled" : ""}>← Previous card</button>
    </div>`;
  }
  el.innerHTML = `
  <div class="section-head"><div><div class="eyebrow">Recall</div><h1>Flashcards</h1><p>${totalCards()} cards across the eight topics. Try to answer before you flip.</p></div></div>
  <div class="toolbar">
    <div class="chips" role="group" aria-label="Deck">
      <button class="chip" data-deck="all" aria-pressed="${FC.deck === "all"}">All topics</button>
      ${CATS.map(c => `<button class="chip" data-deck="${c.id}" aria-pressed="${FC.deck === c.id}">${sw(c.id)}${c.code}</button>`).join("")}
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Which cards"><button data-mode="all" aria-pressed="${FC.mode === "all"}">All cards</button><button data-mode="learning" aria-pressed="${FC.mode === "learning"}">Still learning</button></div>
      <button class="btn" id="fcShuffle">Shuffle</button>
    </div>
  </div>
  ${body}`;
  $$("[data-deck]", el).forEach(b => b.addEventListener("click", () => { FC.deck = b.dataset.deck; buildDeck(false); renderCards(); }));
  $$("[data-mode]", el).forEach(b => b.addEventListener("click", () => { FC.mode = b.dataset.mode; buildDeck(false); renderCards(); }));
  $("#fcShuffle").addEventListener("click", () => { buildDeck(true); renderCards(); });
  const flip = $("#flip");
  if(flip) flip.addEventListener("click", () => { FC.flipped = !FC.flipped; flip.classList.toggle("is-flipped", FC.flipped); });
  const on = (id, fn) => { const b = $("#" + id); if(b) b.addEventListener("click", fn); };
  on("fcKnow", () => mark(true)); on("fcLearn", () => mark(false));
  on("fcBack", () => { if(FC.i > 0){ FC.i--; FC.flipped = false; renderCards({}); } });
  on("fcAll", () => { FC.mode = "all"; buildDeck(false); renderCards(); });
  on("fcReset", () => { const k = knownSet(); deckIds.forEach(id => k.delete(id)); store.set("known", [...k]); buildDeck(false); renderCards(); });
  on("fcAgainLearn", () => { FC.mode = "learning"; buildDeck(true); renderCards(); });
  on("fcRestart", () => { buildDeck(true); renderCards(); });
}
function mark(isKnown){
  const id = FC.order[FC.i]; if(!id) return;
  const k = knownSet(); isKnown ? k.add(id) : k.delete(id); store.set("known", [...k]);
  isKnown ? FC.sessionKnown++ : FC.sessionLearn++;
  if(FC.i < FC.order.length - 1){ FC.i++; FC.flipped = false; } else FC.done = true;
  renderCards({keepScroll: true});
}
document.addEventListener("keydown", e => {
  const ae = document.activeElement;
  if(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return;
  if(ae && ae.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;

const QZ = {run: null};

function makeMC(item, cat){ return {cat, q: item.q, ctx: item.ctx, e: item.e, opts: shuffle(item.a.map((t, k) => ({t, ok: k === 0})))}; }
function startQuiz(cat){
  let qs;

}
function pickQuiz(k){ const r = QZ.run; if(r.picks[r.i] != null) return; r.picks[r.i] = k; renderQuiz({keepScroll: true}); }
function nextQuiz(){ const r = QZ.run; r.i++; if(r.i >= r.qs.length) finishQuiz(); renderQuiz({}); window.scrollTo(0, 0); }
function finishQuiz(){
  const r = QZ.run; const score = r.qs.filter((q, i) => q.opts[r.picks[i]] && q.opts[r.picks[i]].ok).length;

}

/* ---------- PRACTICE EXAM ---------- */
const EXAM_MIN = 60;
const PTS = {mc: 1, fill: 1, match: 2, short: 3};
let EX = store.get("exam", null);
let exTimer = null, exConfirm = false, exAutoNotice = false;
function saveEx(){ store.set("exam", EX); }
function pickDistinct(pool, n){
  const out = [], used = new Set(), sh = shuffle(pool);
  for(const x of sh){ if(out.length >= n) break; if(!used.has(x.cat)){ out.push(x); used.add(x.cat); } }
  for(const x of sh){ if(out.length >= n) break; if(!out.includes(x)) out.push(x); }
  return out;
}
function buildExam(){
  const all = []; CATS.forEach(c => QUIZ[c.id].forEach(x => all.push({x, cat: c.id})));
  let mc = []; CATS.forEach(c => { const p = shuffle(all.filter(o => o.cat === c.id)); mc.push(p[0]); });
  mc = shuffle(mc.concat(shuffle(all.filter(o => !mc.includes(o))).slice(0, 4)));
  const qs = [];
  mc.forEach(o => { const m = makeMC(o.x, o.cat); qs.push({type: "mc", part: 1, cat: o.cat, q: m.q, ctx: m.ctx, e: m.e, opts: m.opts}); });
  pickDistinct(FILL, 6).forEach(f => qs.push(Object.assign({type: "fill", part: 2}, f)));
  shuffle(MATCH).slice(0, 2).forEach(m => qs.push({type: "match", part: 2, cat: m.cat, q: m.q, pairs: m.pairs, rights: shuffle(m.pairs.map(p => p[1]))}));
  pickDistinct(SHORT, 4).forEach(s => qs.push(Object.assign({type: "short", part: 3}, s)));
  const now = Date.now();
  EX = {qs, answers: qs.map(q => q.type === "match" ? q.pairs.map(() => "") : null), flags: qs.map(() => false), start: now, deadline: now + EXAM_MIN * 60000, cur: 0, submitted: false, self: qs.map(q => q.type === "short" ? q.points.map(() => false) : null)};
  exConfirm = false; exAutoNotice = false;
  saveEx();
}
function normText(s){ return String(s || "").toLowerCase().replace(/[’']/g, "'").replace(/[^a-z0-9%.']/g, "").replace(/'/g, ""); }
function gradeQ(q, a){ // returns points earned (auto types only)
  if(q.type === "mc") return a != null && q.opts[a] && q.opts[a].ok ? 1 : 0;
  if(q.type === "fill"){
    if(a == null || String(a).trim() === "") return 0;
    if(q.num != null){ const m = String(a).replace(/,/g, "").match(/-?\d*\.?\d+/); if(!m) return 0; return Math.abs(parseFloat(m[0]) - q.num) <= (q.tol || 0) + 1e-9 ? 1 : 0; }
    const n = normText(a); return q.ans.some(x => normText(x) === n) ? 1 : 0;
  }
  if(q.type === "match"){ const c = q.pairs.filter((p, i) => a && a[i] === p[1]).length; return Math.round(PTS.match * c / q.pairs.length * 100) / 100; }
  return 0;
}
function isAnswered(q, a){
  if(q.type === "match") return a && a.every(v => v);
  return a != null && String(a).trim() !== "";
}
function fmtTime(ms){ ms = Math.max(0, ms); const s = Math.round(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function examActive(){ return EX && !EX.submitted; }
function updateDot(){ const d = $("#examDot"); if(d) d.hidden = !examActive(); }
function startTimer(){

    if(!examActive()){ clearInterval(exTimer); return; }
    const left = EX.deadline - Date.now();
    const t = $("#exTime");
    if(t){ t.textContent = fmtTime(left); t.classList.toggle("warn", left < 10 * 60000 && left >= 5 * 60000); t.classList.toggle("crit", left < 5 * 60000); }
    if(left <= 0){ exAutoNotice = true; submitExam(); }

}
function submitExam(){

  const s = examScore();
  const hist = store.get("examHist", []);
  hist.push({date: new Date().toISOString(), pct: s.pct, auto: s.auto, autoMax: s.autoMax});
  store.set("examHist", hist.slice(-20)); EX.histIndex = Math.min(hist.length, 20) - 1;

}
function examScore(){
  let auto = 0, autoMax = 0, self = 0, selfMax = 0; const byCat = {}, byPart = {1:[0,0], 2:[0,0], 3:[0,0]};
  EX.qs.forEach((q, i) => {

    else { got = gradeQ(q, EX.answers[i]); auto += got; autoMax += max; }

}

function answerText(q, a){
  if(q.type === "mc") return a != null ? q.opts[a].t : "—";
  if(q.type === "fill") return a && String(a).trim() ? a : "—";
  return "";
}
function renderExamResults(el){
  const s = examScore();
  const used = EX.submittedAt ? fmtTime(EX.submittedAt - EX.start) : "—";
  const cats = Object.keys(s.byCat).sort((a, b) => (s.byCat[a][0] / s.byCat[a][1]) - (s.byCat[b][0] / s.byCat[b][1]));
  const weak = cats.filter(c => s.byCat[c][0] / s.byCat[c][1] < .7);
  el.innerHTML = `
  ${exAutoNotice ? `<div class="notice">Time ran out, so your exam was submitted automatically.</div>` : ""}
  <div class="sheet pad">
    <div class="eyebrow">Practice midterm · results</div>
    <div class="row" style="align-items:baseline;gap:18px;margin:10px 0 4px"><div class="result-big" id="resPct">${s.pct}%</div><div class="mono" id="resPts">${fmt(s.total)} / ${s.max} points</div></div>
    <p class="small" style="margin:0">Parts 1–2 are marked automatically. Mark Part 3 below by ticking each key point your answer covered. Your total updates as you go.</p>
    <div class="score-grid">
      <div><b id="p1">${fmt(s.byPart[1][0])}/${s.byPart[1][1]}</b><span>Part 1 · multiple choice</span></div>
      <div><b id="p2">${fmt(s.byPart[2][0])}/${s.byPart[2][1]}</b><span>Part 2 · fill-in &amp; matching</span></div>
      <div><b id="p3">${fmt(s.byPart[3][0])}/${s.byPart[3][1]}</b><span>Part 3 · short answer (self-marked)</span></div>
      <div><b>${used}</b><span>Time used of 60:00</span></div>
    </div>
    <h3 style="font-size:1rem;margin:22px 0 8px">By unit</h3>
    <div class="legend" id="byCat">${catRows(s)}</div>
    ${weak.length ? `<p style="margin:14px 0 0">Focus next on: ${weak.map(c => `<button class="btn ghost" data-go="read" data-arg="${c}" style="padding:4px 8px">${sw(c)} ${CAT[c].code}</button>`).join(" ")}</p>` : ""}
    <div class="row" style="margin-top:18px"><button class="btn primary" id="exNew">New practice exam</button><button class="btn" id="exIntro">Back to exam home</button></div>
  </div>
  <h2 style="font-size:1.2rem;margin:26px 0 4px">Review</h2>
  <div class="review-list">${EX.qs.map((q, i) => reviewItem(q, i)).join("")}</div>`;
  $$(".kp input", el).forEach(cb => cb.addEventListener("change", () => {
    const qi = +cb.dataset.q, pi = +cb.dataset.p; EX.self[qi][pi] = cb.checked; saveEx();
    const ns = examScore();
    $("#resPct").textContent = ns.pct + "%"; $("#resPts").textContent = fmt(ns.total) + " / " + ns.max + " points";
    $("#p3").textContent = fmt(ns.byPart[3][0]) + "/" + ns.byPart[3][1];
    $("#byCat").innerHTML = catRows(ns);
    const it = $(`#sa-${qi}`); const got = EX.self[qi].filter(Boolean).length;
    it.className = "review-item " + (got === 3 ? "ok" : got === 0 ? "no" : "part");
    $(`#sap-${qi}`).textContent = got + " / 3";
    const hist = store.get("examHist", []); if(EX.histIndex != null && hist[EX.histIndex]){ hist[EX.histIndex].pct = ns.pct; store.set("examHist", hist); }
  }));
  $("#exNew").addEventListener("click", () => { buildExam(); EX._entered = true; saveEx(); startTimer(); updateDot(); renderExam({inExam: true}); window.scrollTo(0, 0); });
  $("#exIntro").addEventListener("click", () => renderExamIntro(el));
}
function fmt(x){ return Math.round(x * 100) / 100; }
function catRows(s){
  return CATS.filter(c => s.byCat[c.id]).map(c => { const [g, m] = s.byCat[c.id]; const p = pct(g, m); return `<div class="legend-row">${sw(c.id)}<span class="nm"><b>${c.code}</b> ${c.name}</span><span class="val">${fmt(g)}/${m}</span><div class="mini"><i style="width:${p}%"></i></div></div>`; }).join("");
}
function reviewItem(q, i){
  const a = EX.answers[i]; const head = `<div class="row" style="justify-content:space-between"><span class="small">Q${i + 1} · Part ${q.part} · ${sw(q.cat)} ${CAT[q.cat].code}</span>`;
  if(q.type === "short"){
    const got = EX.self[i].filter(Boolean).length;
    return `<div class="review-item ${got === 3 ? "ok" : got === 0 ? "no" : "part"}" id="sa-${i}">${head}<span class="pill fl" id="sap-${i}">${got} / 3</span></div>
      <p><b>${esc(q.q)}</b></p>${ctxHTML(q)}
      <div class="small">Your answer</div><div class="yours">${a && a.trim() ? esc(a) : '<span class="small">No answer given.</span>'}</div>
      <div class="small">Model answer</div><div class="model">${esc(q.model)}</div>
      <div class="small">Tick each key point your answer covered (1 pt each)</div>
      <div class="kp">${q.points.map((p, k) => `<label><input type="checkbox" data-q="${i}" data-p="${k}" ${EX.self[i][k] ? "checked" : ""}><span>${esc(p)}</span></label>`).join("")}</div></div>`;
  }
  const got = gradeQ(q, a), max = PTS[q.type];
  const cls = got === max ? "ok" : got === 0 ? "no" : "part";
  const pill = `<span class="pill ${got === max ? "ok" : got === 0 ? "no" : "fl"}">${fmt(got)} / ${max}</span></div>`;
  if(q.type === "match"){
    return `<div class="review-item ${cls}">${head}${pill}<p><b>${esc(q.q)}</b></p>${ctxHTML(q)}
      <table class="match">${q.pairs.map((p, k) => `<tr><td>${esc(p[0])}</td><td>${a[k] === p[1] ? `<span style="color:var(--ok)">✓ ${esc(p[1])}</span>` : `<span style="color:var(--bad)">${a[k] ? "✗ " + esc(a[k]) : "✗ (blank)"}</span><br><span class="small">Correct: ${esc(p[1])}</span>`}</td></tr>`).join("")}</table></div>`;
  }
  const right = q.type === "mc" ? q.opts.find(o => o.ok).t : (q.num != null ? String(q.num) : q.ans[0]);
  return `<div class="review-item ${cls}">${head}${pill}<p><b>${esc(q.q)}</b></p>${ctxHTML(q)}
    <p class="small">Your answer: ${esc(answerText(q, a))}</p>
    ${got === max ? "" : `<p>Correct: <b>${esc(right)}</b></p>`}
    <p class="small">${esc(q.e)}</p></div>`;
}

/* ---------- Boot ---------- */
const RENDER = {home: renderHome, read: renderRead, cards: renderCards, quiz: renderQuiz, exam: (o) => renderExam(Object.assign({inExam: examActive() && EX && EX._entered}, o))};
if(EX && !EX.submitted){ if(Date.now() >= EX.deadline){ exAutoNotice = true; submitExam(); } else startTimer(); }
updateDot();
go((location.hash || "#home").slice(1));
})();

</script>

</body>
</html>
